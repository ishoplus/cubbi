<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubbi</title>
<!-- 加到主畫面當 App 開：獨立視窗、沒有網址列。iOS 的主畫面 App 跟 Safari 不共用 localStorage，第一次要重新輸入 token -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cubbi">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d1117">
<style>
  :root {
    --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
    --border: #30363d; --text: #c9d1d9; --text-sub: #8b949e;
    --blue: #58a6ff; --green: #3fb950; --red: #f85149; --orange: #e3b341;
  }
  [data-theme="light"] {
    --bg-primary: #ffffff; --bg-secondary: #f6f8fa; --bg-tertiary: #eaeef2;
    --border: #d0d7de; --text: #1f2328; --text-sub: #656d76;
    --blue: #0969da; --green: #1a7f37; --red: #cf222e; --orange: #9a6700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary); color: var(--text); height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden; }

  /* ── 收件箱 ── */
  body.view-inbox .chat-only { display: none !important; }
  body.view-inbox #workspace { display: none; }
  #inbox-view { flex: 1; display: none; overflow-y: auto; padding: 14px 12px 40px; }
  #inbox-view.active { display: block; }
  #inbox-list { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .nav-tab .nb { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px; margin-left: 4px;
    border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 600; text-align: center; }
  .nav-tab .nb[hidden] { display: none; }
  .ib-empty { text-align: center; color: var(--text-sub); padding: 60px 0; font-size: 14px; }
  .ib-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg-secondary); }
  .ib-card.k-ask { border-left: 3px solid var(--orange); }
  .ib-card.k-review { border-left: 3px solid var(--blue); }
  .ib-card.k-idea { border-left: 3px solid #f2cd37; }
  .ib-idea .ib-hook { font-size: 13.5px; margin-top: 6px; }
  .ib-idea .ib-sub { white-space: pre-line; }
  .ib-card.k-stuck, .ib-card.k-ended { border-left: 3px solid var(--red); }
  .ib-head { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .ib-who { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib-at { font-size: 11px; color: var(--text-sub); flex-shrink: 0; }
  .ib-sub { font-size: 11.5px; color: var(--text-sub); margin-top: 3px; word-break: break-all; }
  .ib-card .ask-card { margin: 8px 0 0; }
  .ib-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .ib-checks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; cursor: pointer; }
  .chip.ok { color: var(--green); border-color: var(--green); }
  .chip.bad { color: var(--red); border-color: var(--red); }
  .d-add { color: var(--green); } .d-del { color: var(--red); }
  .ib-modal { width: min(920px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .ib-sec { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .ib-commit, .ib-file { font-size: 12px; font-family: 'SF Mono', monospace; word-break: break-all; }
  .ib-file { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .ib-file:hover, .ib-file.sel { background: var(--bg-tertiary); }
  .ib-tail { font-size: 11px; background: var(--bg-primary); padding: 8px; border-radius: 6px; white-space: pre-wrap; max-height: 240px; overflow: auto; }
  .ib-diff { font-size: 11.5px; font-family: 'SF Mono', monospace; background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; overflow: auto; white-space: pre; min-height: 120px; }
  .ib-diff .dl-add { color: var(--green); background: rgba(46,160,67,.12); display: inline-block; min-width: 100%; }
  .ib-diff .dl-del { color: var(--red); background: rgba(248,81,73,.12); display: inline-block; min-width: 100%; }
  .ib-diff .dl-hunk { color: var(--blue); } .ib-diff .dl-file { font-weight: 700; } .ib-diff .dl-meta { color: var(--text-sub); }
  .ib-toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 100; }
  .branch-toggle { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--text-sub); cursor: pointer; user-select: none; }
  .branch-toggle[hidden] { display: none; }
  #session-branch { font-size: 11px; font-family: 'SF Mono', monospace; color: var(--blue); cursor: pointer; white-space: nowrap; }
  #session-branch[hidden] { display: none; }

  /* ── Header ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; height: 44px; background: var(--bg-secondary);
    border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 8px;
  }
  .logo { font-weight: 700; font-size: 14px; color: var(--blue); white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 6px; margin-left: auto; min-width: 0; }
  .header-right > * { flex-shrink: 0; }
  #cwd-display { font-size: 11px; color: var(--text-sub); max-width: 200px; min-width: 0; flex-shrink: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cwd-display.cwd-override { color: var(--blue); cursor: pointer; }
  #cwd-display.cwd-override:hover { text-decoration: underline; }
  #session-badge {
    font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px;
  }
  #session-badge .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-sub); flex-shrink: 0;
  }
  #session-badge.active .dot { background: var(--green); }
  #session-badge .sid { font-family: monospace; cursor: pointer; }
  #session-badge .sid:hover { color: var(--text); text-decoration: underline; }
  #session-badge .bg { margin-left: 6px; color: var(--orange); font-size: 11px; }
  .auth-badge {
    font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px;
    padding: 2px 6px; border-radius: 4px; cursor: help;
  }
  .auth-badge .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--text-sub);
  }
  .auth-ok { color: var(--green); }
  .auth-ok .dot { background: var(--green); }
  .auth-fail { color: var(--red); background: rgba(248,81,73,.08); }
  .auth-fail .dot { background: var(--red); }
  .auth-unknown .dot { background: var(--orange); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .btn-icon { width: 28px; height: 28px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: var(--text-sub); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; transition: .15s; }
  /* 開新對話：「＋」比 ✕ 好認（✕ 在別處都是「關閉」）；手機只留圖示 */
  .btn-new-conv { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg-tertiary); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-new-conv:hover { color: var(--blue); border-color: var(--blue); }
  @media (max-width: 600px) { .btn-new-conv { width: 28px; padding: 0; justify-content: center; border-radius: 6px; } .btn-new-conv .txt { display: none; } }
  .btn-icon:hover { background: var(--bg-tertiary); border-color: var(--border); color: var(--text); }
  .btn-icon.active { background: var(--bg-tertiary); border-color: var(--border); color: var(--blue); }

  /* ── Auth overlay ── */
  #auth-overlay {
    position: fixed; inset: 0; background: var(--bg-primary);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .auth-card {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; width: 340px; display: flex;
    flex-direction: column; gap: 16px;
  }
  .auth-card h2 { font-size: 18px; font-weight: 600; }
  .auth-public { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--text-sub); text-align: left; cursor: pointer; }
  .auth-public input { width: auto !important; margin-top: 2px; }
  #code-input { font-size: 24px !important; letter-spacing: 8px; text-align: center; }
  .auth-resend { font-size: 12px; color: var(--text-sub); }
  .auth-card p { font-size: 13px; color: var(--text-sub); }
  .auth-card input {
    background: var(--bg-tertiary); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; width: 100%; outline: none;
  }
  .auth-card input:focus { border-color: var(--blue); }
  .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary:hover { opacity: .85; }
  .auth-error { color: var(--red); font-size: 13px; display: none; }

  /* ── Workspace ── */
  #workspace { flex: 1; display: flex; overflow: hidden; }

  /* ── Chat panel ── */
  #chat-panel { display: flex; flex-direction: column; flex: 1; min-width: 280px; overflow: hidden; position: relative; }
  /* 捲離底部時出現，一鍵回到最新訊息（手機晃一下常跑到對話開頭） */
  #jump-bottom { position: absolute; right: 16px; bottom: calc(var(--input-h, 120px) + 12px); z-index: 5; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
  #jump-bottom.hidden { display: none; }
  /* 像微信：往上看的時候下面有新輸出，箭頭變藍、右上角亮一個閃動的小點 */
  #jump-bottom.has-new { background: var(--blue); border-color: var(--blue); color: #fff; }
  #jump-bottom.has-new::after { content: ''; position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--red); border: 2px solid var(--bg-primary); animation: jb-pulse 1.2s ease-in-out infinite; }
  @keyframes jb-pulse { 50% { opacity: .25; } }
  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; background: var(--bg-tertiary); color: var(--text-sub); }
  .msg.user .avatar { background: var(--blue); color: #fff; }
  .bubble { background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; max-width: calc(100% - 44px);
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: var(--blue); border-color: var(--blue); color: #fff; }
  /* assistant 照 CC 平鋪：沒頭像、沒氣泡框，整條寬度都給內容 */
  .msg.assistant { gap: 0; }
  .msg.assistant .bubble { background: none; border: none; padding: 0; max-width: 100%; }
  .cursor { display: inline-block; width: 2px; height: 14px; background: var(--text);
    animation: blink 1s step-end infinite; vertical-align: text-bottom; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0 } }
  /* 工具行：照 CC 的「● Bash(cmd)」，跑完把點染成綠／紅 */
  .tool-chip { display: flex; align-items: baseline; gap: 7px; font-size: 13px; color: var(--text-sub); }
  .tool-chip .tc-dot { flex-shrink: 0; font-size: 9px; color: var(--text-sub); }
  .tool-block.running .tc-dot { color: var(--orange); animation: pulse 1.2s ease-in-out infinite; }
  .tool-block.ok .tc-dot { color: var(--green); }
  .tool-block.err .tc-dot { color: var(--red); }
  @keyframes pulse { 50% { opacity: .25 } }
  .tool-chip .tc-name { color: var(--text); font-weight: 600; flex-shrink: 0; }
  .tool-chip .tc-arg { font-family: 'SF Mono','Fira Code',monospace; font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 思考段：灰字斜體，預設露三行 */
  .think-block { margin: 6px 0; font-size: 12.5px; color: var(--text-sub); }
  .think-block .tb-head { cursor: pointer; font-style: italic; opacity: .85; user-select: none; }
  .think-block .tb-body { margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--border);
    white-space: pre-wrap; word-break: break-word; font-style: italic; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .think-block.open .tb-body { display: block; }
  /* 工具區塊：工具行 + 結果，結果照 CC 用 tree 記號縮排 */
  .tool-block { margin: 8px 0; }
  .tool-out { position: relative; margin: 3px 0 0 4px; padding-left: 18px;
    font-family: 'SF Mono','Fira Code',monospace; font-size: 11.5px; color: var(--text-sub); }
  .tool-out::before { content: '\2514'; position: absolute; left: 3px; top: -2px; opacity: .55; }
  .tool-out .to-body { white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow-y: auto; }
  .tool-out.err { color: var(--red); }
  .tool-out .to-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tool-out .to-imgs img { max-width: 240px; max-height: 180px; border-radius: 6px; display: block; cursor: zoom-in; border: 1px solid rgba(128,128,128,.3); }
  .tool-out .to-imgs img.big { max-width: 100%; max-height: none; cursor: zoom-out; }
  .tool-out .to-more { margin-top: 3px; color: var(--blue); cursor: pointer; user-select: none; }
  /* Edit/Write 的 diff、TodoWrite 的清單：參數本身就是內容 */
  .tool-detail { margin: 4px 0 0 22px; font-family: 'SF Mono','Fira Code',monospace; font-size: 11.5px; }
  .tool-detail.diff { border-radius: 6px; overflow: hidden; }
  .tool-detail .dl { padding: 0 6px; white-space: pre-wrap; word-break: break-word; }
  .tool-detail .dl.add { background: rgba(63,185,80,.13); color: var(--green); }
  .tool-detail .dl.del { background: rgba(248,81,73,.11); color: var(--red); }
  .tool-detail .dl.more { color: var(--text-sub); }
  .tool-detail.todos { font-family: inherit; font-size: 12.5px; color: var(--text-sub); }
  .tool-detail .td-row { padding: 1px 0; }
  .tool-detail .td-row.completed { text-decoration: line-through; opacity: .55; }
  .tool-detail .td-row.in_progress { color: var(--blue); }
  /* 子 agent（Task）跑的工具：縮排掛在母 Task 底下 */
  .tool-nest { margin: 3px 0 0 22px; font-size: 11.5px; color: var(--text-sub); opacity: .8; }
  .tool-nest .tn-row { font-family: 'SF Mono','Fira Code',monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 回合狀態列：照 CC 的「✻ Working… (12s)」，整輪都掛在最底下 */
  .turn-status { display: flex; align-items: center; gap: 6px; margin-top: 6px;
    font-size: 12.5px; color: var(--text-sub); white-space: normal; }
  .turn-status .ts-glyph { display: inline-block; color: var(--orange); animation: spin 2.4s linear infinite; }
  .turn-status .ts-label { font-style: italic; }
  .turn-status .ts-time { font-variant-numeric: tabular-nums; opacity: .8; }
  /* 斷線重試 */
  .retry-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
    padding: 4px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;
    background: rgba(248,81,73,.12); border: 1px solid var(--red); color: var(--red); }
  /* Claude 停下來問你：授權跑指令，或要你在選項裡挑一個 */
  .ask-card { margin: 8px 0; padding: 12px; border-radius: 10px;
    background: var(--bg-tertiary); border: 1px solid var(--orange); }
  .ask-card.resolved { border-color: var(--border); opacity: .6; }
  .ask-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    font-size: 12px; font-weight: 600; color: var(--orange); }
  .ask-card.resolved .ask-head { color: var(--text-sub); }
  .ask-reason { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }
  .ask-cmd { font-family: 'SF Mono', monospace; font-size: 12px; white-space: pre-wrap;
    word-break: break-all; background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; margin-bottom: 10px; color: var(--text); }
  .ask-q { font-size: 13px; color: var(--text); margin: 4px 0 8px; font-weight: 600; }
  .ask-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ask-btn { padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px;
    border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text); }
  .ask-btn:hover { border-color: var(--blue); }
  .ask-btn.primary { background: rgba(63,185,80,.14); border-color: var(--green); color: var(--green); }
  .ask-btn.danger  { background: rgba(248,81,73,.12); border-color: var(--red); color: var(--red); }
  .ask-card.resolved .ask-actions { display: none; }
  /* 選項題：整塊可點，描述要看得到，不然只有 label 根本選不下去 */
  .ask-opt { display: block; width: 100%; text-align: left; padding: 8px 12px; margin-bottom: 6px;
    border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
    background: var(--bg-secondary); color: var(--text); font-size: 13px; }
  .ask-opt:hover { border-color: var(--blue); }
  .ask-opt.picked { border-color: var(--blue); background: rgba(88,166,255,.12); }
  .ask-opt .ao-label { font-weight: 600; display: block; }
  .ask-opt .ao-desc { display: block; font-size: 11px; color: var(--text-sub); margin-top: 3px;
    white-space: normal; line-height: 1.45; }
  .ask-other { width: 100%; box-sizing: border-box; padding: 7px 10px; margin-bottom: 6px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg-primary);
    color: var(--text); font-size: 13px; font-family: inherit; }
  .ask-verdict { font-size: 12px; color: var(--text-sub); margin-top: 6px; }
  /* Markdown 渲染 */
  .bubble.md { white-space: normal; }
  .bubble.md p { margin: 0 0 8px; white-space: pre-wrap; }
  .bubble.md p:last-child { margin-bottom: 0; }
  .bubble.md pre { background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .bubble.md code { font-family: 'SF Mono','Fira Code',monospace; font-size: 12.5px; }
  .bubble.md :not(pre) > code { background: var(--bg-tertiary); padding: 1px 5px;
    border-radius: 4px; }
  .bubble.md ul, .bubble.md ol { margin: 6px 0 8px; padding-left: 22px; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3 { margin: 10px 0 6px; line-height: 1.3; }
  .bubble.md a { color: var(--blue); overflow-wrap: anywhere; }
  .msg.user .bubble a { color: inherit; text-decoration: underline; overflow-wrap: anywhere; }
  .bubble.md li { margin: 2px 0; }
  .bubble.md li > ul, .bubble.md li > ol { margin: 2px 0; }
  .bubble.md blockquote { margin: 8px 0; padding: 2px 0 2px 10px;
    border-left: 3px solid var(--border); color: var(--text-sub); }
  .bubble.md blockquote p:last-child { margin-bottom: 0; }
  .bubble.md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .bubble.md del { opacity: .6; }
  .bubble.md .md-task { margin-right: 5px; }
  .md-table { overflow-x: auto; margin: 8px 0; }
  /* 蓋掉檔案列表那條全域 table{width:100%}：手機上會把欄位擠成一字一行；改成照內容寬、外層橫捲 */
  .md-table table { border-collapse: collapse; font-size: 13px; width: max-content; }
  .md-table th, .md-table td { border: 1px solid var(--border); padding: 5px 9px; text-align: left;
    min-width: 4em; max-width: 260px; overflow-wrap: break-word; }
  .md-table th { background: var(--bg-tertiary); font-weight: 600; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--text-sub); }
  .empty-state h2 { font-size: 22px; color: var(--text); }
  .sys-msg { text-align: center; font-size: 11px; color: var(--text-sub);

    border: 1px solid var(--blue); border-radius: 8px; background: rgba(88,166,255,.05); }

  #tf-chat .cq-head { font-size: 11.5px; color: var(--text-sub); font-weight: 600; }
  #tf-chat .cq { display: flex; flex-direction: column; gap: 5px; }
  #tf-chat .cq-q { font-size: 12.5px; line-height: 1.5; }
  #tf-chat .cq-why { font-size: 11px; color: var(--text-sub); line-height: 1.5; }
  #tf-chat .cq-opts { display: flex; flex-wrap: wrap; gap: 5px; }
  #tf-chat .cq-opt { border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text);
    border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; transition: .15s; }
  #tf-chat .cq-opt:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  #tf-chat .cq-opt.sel { border-color: var(--blue); background: rgba(88,166,255,.16); color: var(--blue); }
  #tf-chat .cq-free { width: 100%; height: 28px; padding: 0 8px; font-size: 12.5px;
    border: 1px solid var(--border); border-radius: 5px; background: var(--bg-primary); color: var(--text); }
  #tf-chat .cq-free:focus { border-color: var(--blue); outline: none; }
  #tf-chat .cq-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .field .row input { flex: 1; }
  .dirpick-list { border: 1px solid var(--border); border-radius: 7px; height: 260px;
    overflow-y: auto; background: var(--bg-primary); }
  .dirpick-item { padding: 7px 10px; font-size: 12.5px; cursor: pointer;
    border-bottom: 1px solid var(--border); display: flex; gap: 7px; align-items: center; }
  .dirpick-item:hover { background: var(--bg-tertiary); }
  .dirpick-cur { font-size: 11px; color: var(--text-sub); font-family: 'SF Mono', monospace;
    word-break: break-all; }

  #td-back { display: none; }

  /* Mobile: stack vertically */
  @media (max-width: 600px) {
    /* 窄螢幕 header 放不下：只留 logo 圖示、認證只留燈號（title 仍有說明），cwd 靠省略號吸收剩餘寬度 */
    header { padding: 0 8px; gap: 6px; }

    .wide-only { display: none !important; }   /* 窄螢幕：裝置、主題收進 📱 的視窗 */
    /* iOS 聚焦字級 <16px 的輸入框會自動放大且不縮回，header 就被擠出畫面 */
    input, textarea, select, #prompt-input,
    .field input, .field textarea, .field select, .action-card textarea { font-size: 16px; }
    .nav-tab { padding: 4px 10px; }
    #td-back { display: flex; }

    /* 直式放不下左右兩欄（預覽 100% 寬會把檔案清單擠成 0）：平常只顯示清單，點檔案時預覽蓋滿這一塊，← 回清單 */
    #files-main { position: relative; }

/* 嵌在 3D 空間的面板裡：只留對話 */
body.embed header, body.embed #files-panel, body.embed #resize-handle { display: none !important; }

<script>
// ── iOS 視窗修正 ─────────────────────────────────────────────────────────────
// iOS 鍵盤彈出時不縮 layout viewport，而是把整頁往上推，header 就被推出畫面、
// 收鍵盤後還常停在偏移位置。改用 visualViewport 高度當 body 高度，並把頁面釘回頂部。
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fitViewport = () => {
    // 使用者雙指縮放時不干預，交還給瀏覽器
    if (Math.abs(vv.scale - 1) > 0.01) { document.body.style.height = ''; return; }
    document.body.style.height = vv.height + 'px';
    if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
  };
  vv.addEventListener('resize', fitViewport);
  vv.addEventListener('scroll', fitViewport);
  window.addEventListener('scroll', fitViewport);
  fitViewport();
}

// ── State ─────────────────────────────────────────────────────────────────────
// 通行證：別人的電腦只放 sessionStorage（關掉瀏覽器就沒了），自己的裝置放 localStorage
let TOKEN = sessionStorage.getItem('cg_token') || localStorage.getItem('cg_token') || '';
function saveToken(t, isPublic) {
  TOKEN = t;
  if (isPublic) { sessionStorage.setItem('cg_token', t); localStorage.removeItem('cg_token'); }
  else { localStorage.setItem('cg_token', t); sessionStorage.removeItem('cg_token'); }
}
function clearToken() { TOKEN = ''; localStorage.removeItem('cg_token'); sessionStorage.removeItem('cg_token'); }
let streaming = false;
let abortController = null;
// 目前這段對話一直寫在網址上（?session=<id>&cwd=<路徑>，見 syncUrl）：手機瀏覽器把背景分頁
// 收掉再重載時網址一定還在，每個分頁接回自己那段；外部開好的對話（ai-radar 推播）也用同一組參數接上。
// 網址沒帶 → 同分頁的 sessionStorage → 只有主畫面 App 才退回 localStorage 的「最後一段」
// （它重開只會開 start_url）。一般分頁不退回：新分頁就是新對話，不會跟別的分頁搶同一段。
// 嵌在 3D 空間裡的面板不記「上一段」：它只看網址，記了反而會讓主畫面 App 和下一個「＋」接回錯的那段
const saveConv = (k, v) => { if (EMBED) return; sessionStorage.setItem(k, v); localStorage.setItem(k, v); };
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const loadConv = k => sessionStorage.getItem(k) || (isStandalone ? localStorage.getItem(k) : null);
const linkParams = new URLSearchParams(location.search);
// 嵌在 3D 空間（/space.html）的面板裡：只留對話，標頭與檔案面板收起來；
// 每次都以網址為準（沒帶 session 就是新對話），不沿用同分頁上一段
const EMBED = linkParams.get('embed') === '1';
if (EMBED) {
  document.body.classList.add('embed');
  sessionStorage.removeItem('cg_session');
}
if (EMBED) {
  if (linkParams.get('cwd')) sessionStorage.setItem('cg_cwd', linkParams.get('cwd'));
} else if (linkParams.get('session')) {
  saveConv('cg_session', linkParams.get('session'));
  if (linkParams.get('cwd')) saveConv('cg_cwd', linkParams.get('cwd'));
}
// 嵌入面板：對話編號只認網址（沒帶就是新對話）。不能退回 localStorage 的「最後一段」——
// 主畫面 App（display-mode: standalone）裡的嵌入頁也算 standalone，會接回上一段（辦公室按 ＋ 卻沿用舊 session）
let sessionId = EMBED ? (linkParams.get('session') || null) : (loadConv('cg_session') || null);

function syncUrl() {
  const q = new URLSearchParams();
  if (sessionId) {
    q.set('session', sessionId);
    if (cwd) q.set('cwd', cwd);
  }
  if (EMBED) {
    q.set('embed', '1');
    // 新對話拿到 id 時讓空間知道，好把新人物放上去
    if (sessionId && window.parent !== window) window.parent.postMessage({ type: 'cw-session', sessionId, cwd }, location.origin);
  }
  const qs = q.toString();
  const url = '/' + (qs ? '?' + qs : '');
  if (location.pathname + location.search !== url) history.replaceState(null, '', url);
}

let workRoot = '';
let cwd = '';            // Claude 實際執行目錄（預設 = workRoot）
let currentPath = '';
let selectedPaths = new Set();
let previewFilePath = null;
let previewTextContent = null;
let currentItems = [];
let fileFilter = '';
let maxAutoRetry = 3;      // 由 /api/tasks 回報：評審沒過時自動續修的上限
let sortKey = 'name';   // name | size | mtime
let sortDir = 1;        // 1 升冪 / -1 降冪

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Session helpers ───────────────────────────────────────────────────────────
function updateSessionBadge() {
  const badge = document.getElementById('session-badge');
  const sid = document.getElementById('session-sid');
  if (sessionId) {
    badge.classList.add('active');
    sid.textContent = sessionId.slice(0, 8);
    badge.title = sessionId + '（點擊複製）';
  } else {
    badge.classList.remove('active');
    sid.textContent = '新對話';
    badge.title = '';
  }
  document.getElementById('branch-toggle').hidden = !!sessionId;   // 分支只能開新對話時選
  updateBranchBadge();
  syncUrl();
}

function copySessionId() {
  if (!sessionId) return;
  navigator.clipboard.writeText(sessionId).then(() => {
    const sid = document.getElementById('session-sid');
    const prev = sid.textContent;
    sid.textContent = '已複製';
    setTimeout(() => { sid.textContent = prev; }, 1200);
  });
}

function appendSysMsg(text) {
  document.getElementById('empty-state')?.remove();
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  container.appendChild(div);
  scrollMessages();
  return div;
}

// ── Auth ─────────────────────────────────────────────────────────────────────
async function verifyToken(t) {
  try {
    const r = await fetch('/api/info', { headers: { 'x-access-token': t } });
    return r.ok;
  } catch { return false; }
}

// 登入：寄驗證碼到固定信箱 → 輸入 6 位數 → 換一張通行證
let authReq = null;
const authErr = (m) => { const el = document.getElementById('auth-error'); el.textContent = m || ''; el.style.display = m ? 'block' : 'none'; };
async function sendCode() {
  const btn = document.getElementById('send-code-btn');
  btn.disabled = true; btn.textContent = '寄送中…'; authErr('');
  try {
    const r = await fetch('/api/auth/email-code', { method: 'POST' });
    const j = await r.json();
    if (!r.ok) { authErr(j.error || '寄不出去'); return; }
    authReq = j.reqId;
    document.getElementById('auth-msg').textContent = `驗證碼已寄到 ${j.to}，10 分鐘內有效`;
    btn.style.display = 'none';
    for (const id of ['code-input', 'login-btn']) document.getElementById(id).style.display = '';
    document.getElementById('resend-link').style.display = '';
    document.getElementById('code-input').focus();
  } catch { authErr('連線失敗'); }
  finally { btn.disabled = false; btn.textContent = '寄驗證碼到我的信箱'; }
}
async function login() {
  if (login.busy) return;   // 輸滿 6 碼會自動送出，再按登入不要重複送（會多扣一次機會）
  login.busy = true;
  try { await doLogin(); } finally { login.busy = false; }
}
async function doLogin() {
  const code = document.getElementById('code-input').value.trim();
  if (!/^\d{6}$/.test(code) || !authReq) { authErr('請輸入信裡的 6 位數驗證碼'); return; }
  const isPublic = document.getElementById('public-chk').checked;
  try {
    const r = await fetch('/api/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reqId: authReq, code, public: isPublic }) });
    const j = await r.json();
    if (!r.ok) { authErr(j.error || '登入失敗'); if (/作廢|過期/.test(j.error || '')) resetAuth(); return; }
    saveToken(j.token, j.public);
    location.reload();   // 用新的通行證從頭載入（對話、檔案、監聽都重新接上）
  } catch { authErr('連線失敗'); }
}
function resetAuth() {
  authReq = null;
  document.getElementById('send-code-btn').style.display = '';
  for (const id of ['code-input', 'login-btn', 'resend-link']) document.getElementById(id).style.display = 'none';
  document.getElementById('code-input').value = '';
  document.getElementById('auth-msg').textContent = '登入要用信箱驗證碼';
}
function showLogin() { clearToken(); resetAuth(); document.getElementById('auth-overlay').style.display = 'flex'; }
document.getElementById('send-code-btn').addEventListener('click', sendCode);
document.getElementById('resend-link').addEventListener('click', (e) => { e.preventDefault(); resetAuth(); sendCode(); });
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('code-input').addEventListener('input', (e) => { if (/^\d{6}$/.test(e.target.value.trim())) login(); });
document.getElementById('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); login(); } });

// 已登入的裝置：列出、踢掉某一台、登出其他全部、登出這台
// ── 用手機開：挑一個連得到的網址，QR 裡帶一次性登入票（10 分鐘、用一次就失效）──
async function openConnect() {
  let info;
  try { const r = await fetch('/api/connect', { headers: { 'x-access-token': TOKEN } }); info = await r.json(); if (!r.ok) throw new Error(info.error); } catch (e) { alert('拿不到連線資訊：' + e.message); return; }
  const remote = info.urls.filter(u => u.kind !== 'local');
  const help = `<div class="cn-help">現在只有這台電腦連得到。要從手機用：
    <ul><li><b>同一個 Wi-Fi</b>：在這台電腦執行 <code>npx cubbi setup</code>，選「同一個 Wi-Fi」</li>
    <li><b>出門也要用</b>：裝 <a href="https://tailscale.com/download" target="_blank">Tailscale</a>（電腦和手機都裝、登入同一個帳號），再執行 <code>npx cubbi setup</code> 選 Tailscale</li></ul></div>`;
  const back = showModal(`<div class="modal" style="width:420px"><div class="modal-head">用手機開<button class="btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body cn-body">${remote.length ? `
      <select id="cn-url">${remote.map(u => `<option value="${escHtml(u.url)}">${escHtml(u.label)} · ${escHtml(u.url)}</option>`).join('')}</select>
      <label class="cn-pub"><input type="checkbox" id="cn-public"> 別人的電腦（不記住，關掉就登出）</label>
      <div id="cn-qr" class="cn-qr">產生中…</div><div id="cn-note" class="cn-note"></div>` : help}
      <div class="cn-more"><button class="btn-tool" onclick="closeModal(); openDevices()">🔒 已登入的裝置</button><button class="btn-tool" onclick="toggleTheme()">◐ 切換主題</button></div></div></div>`);
  if (!remote.length) return;
  const make = async () => {
    const r = await fetch('/api/connect/ticket', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-access-token': TOKEN },
      body: JSON.stringify({ url: back.querySelector('#cn-url').value, public: back.querySelector('#cn-public').checked }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { back.querySelector('#cn-qr').textContent = j.error || '產生不了'; return; }
    back.querySelector('#cn-qr').innerHTML = j.svg;
    back.querySelector('#cn-note').innerHTML = `用手機相機掃，掃了就登入（${j.ttlMin} 分鐘內、用一次就失效）。${j.kind === 'lan' ? '<br>手機要連同一個 Wi-Fi。' : ''}<br><a href="#" id="cn-copy">複製連結</a>`;
    back.querySelector('#cn-copy').onclick = (e) => { e.preventDefault(); navigator.clipboard?.writeText(j.link); e.target.textContent = '已複製'; };
  };
  back.querySelector('#cn-url').onchange = make;
  back.querySelector('#cn-public').onchange = make;
  make();
}

async function openDevices() {
  let list = [];
  try { list = await (await fetch('/api/auth/sessions', { headers: { 'x-access-token': TOKEN } })).json(); } catch {}
  const ago = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? '剛剛' : m < 60 ? `${m} 分鐘前` : m < 1440 ? `${Math.floor(m / 60)} 小時前` : `${Math.floor(m / 1440)} 天前`; };
  showModal(`<div class="modal" style="width:460px"><div class="modal-head">已登入的裝置<button class="btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${Array.isArray(list) && list.length ? list.map(s => `<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0"><b>${escHtml(s.ua)}</b>${s.current ? ' <span style="color:var(--blue)">（這台）</span>' : ''}${s.public ? ' <span style="color:var(--text-sub)">· 別人的電腦</span>' : ''}
      <div style="font-size:12px;color:var(--text-sub)">${escHtml(s.ip || '')} · 最後使用 ${ago(s.lastUsed)} · 登入於 ${new Date(s.created).toLocaleString('zh-TW')}</div></div>
      ${s.current ? '' : `<button class="btn-tool danger" onclick="revokeDevice('${s.id}')">踢掉</button>`}</div>`).join('') : '<div style="color:var(--text-sub)">沒有其他裝置</div>'}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn-tool" onclick="revokeDevice(null, true)">登出其他所有裝置</button><button class="btn-tool danger" onclick="logoutHere()">登出這台</button></div></div></div>`);
}
async function revokeDevice(id, all) {
  await fetch('/api/auth/revoke', { method: 'POST', headers: { 'x-access-token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(all ? { all: true } : { id }) });
  openDevices();
}
async function logoutHere() {
  try { await fetch('/api/auth/logout', { method: 'POST', headers: { 'x-access-token': TOKEN } }); } catch {}
  closeModal(); showLogin();
}

async function loadInfo() {
  const r = await fetch('/api/info', { headers: { 'x-access-token': TOKEN } });
  const data = await r.json();
  workRoot = data.workRoot;
  currentPath = data.workRoot;
  // 還原上次的執行目錄，但需仍在 root 內（WORK_ROOT 可能已變）
  const stored = loadConv('cg_cwd');
  cwd = (stored && (stored === workRoot || stored.startsWith(workRoot + '/'))) ? stored : workRoot;
  updateCwdDisplay();
  updateAuthBadge(data.claudeAuth);
  // 伺服器沒開「全部放行」就從選單拿掉；之前選過的退回 auto
  if (!data.allowBypass) {
    const perm = document.getElementById('chat-perm');
    perm.querySelector('option[value="bypassPermissions"]')?.remove();
    if (!perm.value) { perm.value = 'auto'; localStorage.setItem('cg_chat_perm', 'auto'); }
  }
  // 代理人：Codex 裝了且登入才出現在選單；專案預設在開新對話時預先選好
  availableDrivers = data.drivers || ['claude'];
  projectDrivers = data.projectDrivers || {};
  if (!availableDrivers.includes('codex')) {
    document.getElementById('og-codex')?.remove();
    if (chatModel.value.startsWith('codex:')) { chatModel.value = ''; localStorage.setItem('cg_chat_model', ''); }
  }
  if (!sessionId) applyProjectDriver();
  if (sessionId) await loadHistory();   // 重開頁面也要看得到前面講過的話，不然看起來像新對話
}

// 選單的值：Claude 的是模型名（空的＝預設），Codex 的是 codex:<模型>
let availableDrivers = ['claude'], projectDrivers = {};
const driverOfChoice = (v) => v.startsWith('codex:') ? { driver: 'codex', model: v.slice(6) } : { driver: 'claude', model: v };
// 這個資料夾有專案預設就預先選好（只在新對話；接續的對話一律是原本那家）
function applyProjectDriver() {
  const parts = (cwd || '').split('/');
  const hit = Object.entries(projectDrivers).find(([k]) => k.startsWith('/') ? (cwd === k || cwd.startsWith(k + '/')) : parts.includes(k));
  if (!hit) return;
  const cur = driverOfChoice(chatModel.value).driver;
  if (cur !== hit[1]) chatModel.value = hit[1] === 'codex' ? 'codex:' : '';
}

// 把接上的對話前面講過的話畫出來；載入失敗就只留「接續對話」提示，照樣可以追問
async function loadHistory() {
  if (!sessionId) return;
  markSeen(sessionId);   // 打開這段對話＝看過（收件箱的「做完了」消失，辦公室也是）；紀錄載不載得到都算
  try {
    const r = await fetch('/api/session-history?sessionId=' + encodeURIComponent(sessionId), { headers: { 'x-access-token': TOKEN } });
    if (!r.ok) return;
    const { messages, driver } = await r.json();
    // 接上的是 Codex 的對話：選單跟著換，下一句才不會帶 Claude 的模型名過去
    if (driver === 'codex' && !chatModel.value.startsWith('codex:') && availableDrivers.includes('codex')) chatModel.value = 'codex:';
    for (const m of messages) {
      const bubble = appendMessage(m.role, m.text);
      if (m.role === 'assistant') bubble.innerHTML = renderMarkdown(m.text);
    }
    scrollMessages(true);
  } catch {}
}

// 認證狀態：null=未知/檢查中，true=ok，false=失敗
function updateAuthBadge(state) {
  const badge = document.getElementById('auth-badge');
  const label = document.getElementById('auth-label');
  if (!badge || !label) return;
  badge.classList.remove('auth-ok', 'auth-fail', 'auth-unknown');
  if (!state || state.ok === null) {
    badge.classList.add('auth-unknown');
    label.textContent = '檢查中…';
    badge.title = '正在檢查 Claude CLI 認證狀態';
  } else if (state.ok) {
    badge.classList.add('auth-ok');
    label.textContent = '已登入';
    badge.title = 'Claude CLI 已登入';
  } else {
    badge.classList.add('auth-fail');
    label.textContent = '未登入';
    badge.title = (state.lastError || 'Claude CLI 認證失敗') + '\n請在本機執行 `claude setup-token`，存進 Keychain（service: claude-code-oauth-token）';
  }
}

function setCwd(path) {
  cwd = path;
  saveConv('cg_cwd', path);
  updateCwdDisplay();
  syncUrl();
  if (!sessionId) applyProjectDriver();
}

function updateCwdDisplay() {
  const el = document.getElementById('cwd-display');
  if (!el) return;
  if (cwd === workRoot) {
    el.textContent = workRoot;
    el.classList.remove('cwd-override');
    el.title = 'Claude 執行目錄：根目錄';
    el.onclick = null;
  } else {
    const rel = cwd.slice(workRoot.length).replace(/^\//, '');
    el.textContent = '▶ ' + rel + ' ✕';
    el.classList.add('cwd-override');
    el.title = 'Claude 在此執行：' + cwd + '（點擊重設回根目錄）';
    el.onclick = () => { setCwd(workRoot); appendSysMsg('📁 執行目錄已重設回根目錄'); maybeSuggestNewConv(); };
  }
}

// 檔案面板「在此執行」：把當前瀏覽目錄設為 Claude 的 cwd
function runHere() {
  if (cwd === currentPath) return;
  setCwd(currentPath);
  const rel = currentPath === workRoot ? '根目錄' : currentPath.slice(workRoot.length).replace(/^\//, '');
  appendSysMsg('📁 Claude 執行目錄 · ' + rel);
  maybeSuggestNewConv();
}

// cwd 改變且有進行中對話時：該 session 綁在舊目錄，提示開新對話
function maybeSuggestNewConv() {
  if (!sessionId) return;
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'sys-msg sys-warn';
  div.append('⚠ 目前對話仍綁在舊目錄 · ');
  const action = document.createElement('span');
  action.className = 'sys-action';
  action.textContent = '開新對話';
  action.onclick = newConversation;
  div.append(action);
  container.appendChild(div);
  scrollMessages();
}

(async () => {
  const ticket = linkParams.get('ticket');
  if (ticket) {
    history.replaceState(null, '', '/');   // 票不留在網址上
    try {
      const r = await fetch('/api/auth/ticket-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticket, public: linkParams.get('public') === '1' }) });
      const j = await r.json();
      if (r.ok) saveToken(j.token, j.public); else alert(j.error || '登入連結無效');
    } catch {}
  }
  const urlToken = linkParams.get('token');
  if (urlToken) saveToken(urlToken, false);
  if (urlToken) history.replaceState(null, '', '/');   // token 不留在網址上；對話參數之後由 syncUrl 寫回
  if (TOKEN && await verifyToken(TOKEN)) {
    await loadInfo();
    applyLayout();
    updateSessionBadge();
    if (sessionId) appendSysMsg('接續對話 · ' + sessionId.slice(0, 8));
    startWatch();   // 這段對話的進程可能還活著（背景任務在跑），接上來聽
    if (filesVisible && currentPath) loadDir(currentPath);
    // 嵌在辦公室裡（embed）的是某一段對話：一律顯示對話，不跟著主頁上次停在哪個分頁（共用同一份 localStorage），也不必輪詢收件箱
    if (!EMBED) {
      if (linkParams.get('inbox')) switchView('inbox');
      else if (['tasks', 'inbox'].includes(localStorage.getItem('cg_view'))) switchView(localStorage.getItem('cg_view'));
      startInboxPoll();
    }
  } else {
    showLogin();
  }
  const saved = localStorage.getItem('cg_theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  // 定期刷新認證狀態（server 每 5 分鐘背景檢查，前端每 60s 拉一次）
  setInterval(async () => {
    if (!TOKEN) return;
    try {
      const r = await fetch('/api/info', { headers: { 'x-access-token': TOKEN } });
      if (r.status === 401) { showLogin(); return; }   // 通行證過期或被踢掉
      if (r.ok) {
        const d = await r.json();
        updateAuthBadge(d.claudeAuth);
      }
    } catch {}
  }, 60000);
})();

// ── Layout: resize & toggle ───────────────────────────────────────────────────
let filesVisible = !EMBED && localStorage.getItem('cg_files_open') !== 'false';
let filesWidth = parseInt(localStorage.getItem('cg_files_width') || '400');

function applyLayout() {
  const fp = document.getElementById('files-panel');
  const rh = document.getElementById('resize-handle');
  const arrow = document.getElementById('resize-arrow');
  const btn = document.getElementById('btn-toggle-files');

  if (filesVisible) {
    fp.classList.remove('hidden');
    fp.style.width = filesWidth + 'px';
    rh.classList.remove('files-hidden');
    arrow.textContent = '▶';
    btn.classList.add('active');
  } else {
    fp.classList.add('hidden');
    rh.classList.add('files-hidden');
    arrow.textContent = '◀';
    btn.classList.remove('active');
  }
}

function toggleFiles() {
  filesVisible = !filesVisible;
  localStorage.setItem('cg_files_open', filesVisible);
  applyLayout();
  if (filesVisible && currentPath) loadDir(currentPath);
}

// Click on handle when files hidden → toggle open
document.getElementById('resize-handle').addEventListener('click', e => {
  if (!filesVisible) toggleFiles();
});

// Drag to resize
const resizeHandle = document.getElementById('resize-handle');
let isDragging = false, dragStartX = 0, dragStartWidth = 0;

resizeHandle.addEventListener('mousedown', e => {
  if (!filesVisible) return;
  e.preventDefault();
  isDragging = true;
  dragStartX = e.clientX;
  dragStartWidth = filesWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  resizeHandle.classList.add('dragging');
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const workspace = document.getElementById('workspace');
  const wRect = workspace.getBoundingClientRect();
  // files panel is on the right; its width = right edge of workspace - cursor x
  const newWidth = wRect.right - e.clientX;
  const minFiles = 180, minChat = 260;
  filesWidth = Math.max(minFiles, Math.min(wRect.width - minChat - 5, newWidth));
  document.getElementById('files-panel').style.width = filesWidth + 'px';
});

document.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  resizeHandle.classList.remove('dragging');
  localStorage.setItem('cg_files_width', Math.round(filesWidth));
});

// Touch support
resizeHandle.addEventListener('touchstart', e => {
  if (!filesVisible) return;
  isDragging = true;
  dragStartX = e.touches[0].clientX;
  dragStartWidth = filesWidth;
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const workspace = document.getElementById('workspace');
  const wRect = workspace.getBoundingClientRect();
  const newWidth = wRect.right - e.touches[0].clientX;
  filesWidth = Math.max(180, Math.min(wRect.width - 260 - 5, newWidth));
  document.getElementById('files-panel').style.width = filesWidth + 'px';
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  localStorage.setItem('cg_files_width', Math.round(filesWidth));
});

// ── Chat ─────────────────────────────────────────────────────────────────────
const promptInput = document.getElementById('prompt-input');
const btnSend = document.getElementById('btn-send');
const btnAbort = document.getElementById('btn-abort');
let isComposing = false;
let attachments = [];     // 輸入框夾的圖：{ media_type, data(base64), url(預覽用) }
let activeTurn = null;    // 正在串的那一輪（回合中補一句時要把後續輸出接到下面）
let queuedAfterTurn = []; // 回合收尾那一瞬間才補的話：/message 來不及，等這輪結束再正常送

// 對話模型：選了就記住。換模型時伺服器會收掉舊進程、用同一個 sessionId --resume 重開，上下文不丟
const chatModel = document.getElementById('chat-model');
chatModel.value = localStorage.getItem('cg_chat_model') || '';
chatModel.addEventListener('change', () => localStorage.setItem('cg_chat_model', chatModel.value));
const chatPerm = document.getElementById('chat-perm');
chatPerm.value = localStorage.getItem('cg_chat_perm') || 'auto';
chatPerm.addEventListener('change', () => localStorage.setItem('cg_chat_perm', chatPerm.value));

promptInput.addEventListener('compositionstart', () => { isComposing = true; });
promptInput.addEventListener('compositionend', () => { isComposing = false; });

// 選字中的 Enter 不能當送出。Safari 的順序是 compositionend 先、keydown 後，
// 只靠自己的旗標會在按 Enter 選中文字的那一下直接送出去，所以要連 keyCode 229 一起看
const composingKey = e => e.isComposing || e.keyCode === 229 || isComposing;

function refreshSendBtn() {
  btnSend.disabled = !(promptInput.value.trim() || attachments.length);
}
function autosize() {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + 'px';
}

// ── 輸入歷史與草稿（照 CC：↑↓ 翻以前送過的話；沒送出的字重整頁面也還在）──
const HIST_KEY = 'cg_input_history', DRAFT_KEY = 'cg_input_draft', HIST_MAX = 200;
let inputHistory = (() => { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; } })();
let histIdx = -1;     // -1 = 沒在翻；否則是 inputHistory 的索引（越大越新）
let histStash = '';   // 開始翻之前正在打的字，翻回底部時還給他
let draftTimer = null;

function saveDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => localStorage.setItem(DRAFT_KEY, promptInput.value), 300);
}
function pushHistory(text) {
  if (!text || inputHistory[inputHistory.length - 1] === text) return;
  inputHistory.push(text);
  if (inputHistory.length > HIST_MAX) inputHistory = inputHistory.slice(-HIST_MAX);
  localStorage.setItem(HIST_KEY, JSON.stringify(inputHistory));
}
function setInput(text) {
  promptInput.value = text;
  promptInput.setSelectionRange(text.length, text.length);
  autosize(); refreshSendBtn(); saveDraft();
}
function historyStep(dir) {
  if (!inputHistory.length) return false;
  if (histIdx === -1) {
    if (dir > 0) return false;
    histStash = promptInput.value;
    histIdx = inputHistory.length;
  }
  const next = histIdx + dir;
  if (next < 0) return true;                       // 已經最舊，吃掉按鍵就好
  if (next >= inputHistory.length) { histIdx = -1; setInput(histStash); return true; }
  histIdx = next;
  setInput(inputHistory[histIdx]);
  return true;
}

promptInput.value = localStorage.getItem(DRAFT_KEY) || '';
autosize(); refreshSendBtn();

promptInput.addEventListener('input', () => {
  histIdx = -1;
  autosize(); refreshSendBtn(); saveDraft();
  updateCompletion();
});
promptInput.addEventListener('click', () => updateCompletion());
promptInput.addEventListener('blur', () => setTimeout(closeCompletion, 150));

promptInput.addEventListener('keydown', e => {
  if (cp && !composingKey(e)) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      cp.idx = (cp.idx + (e.key === 'ArrowDown' ? 1 : -1) + cp.items.length) % cp.items.length;
      renderCompletion();
      return;
    }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) { e.preventDefault(); acceptCompletion(); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeCompletion(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey && !composingKey(e)) {
    e.preventDefault();
    if (!btnSend.disabled) sendMessage();
    return;
  }
  if (e.key === 'Escape' && streaming) { e.preventDefault(); abortStream(); return; }
  if (composingKey(e) || e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const v = promptInput.value, s = promptInput.selectionStart;
  if (s !== promptInput.selectionEnd) return;
  // 游標在第一行才翻上一則、在最後一行才翻下一則，多行編輯時方向鍵照常移動游標
  if (e.key === 'ArrowUp' && !v.slice(0, s).includes('\n') && (histIdx !== -1 || !v || s === 0)) {
    if (historyStep(-1)) e.preventDefault();
  } else if (e.key === 'ArrowDown' && histIdx !== -1 && !v.slice(s).includes('\n')) {
    if (historyStep(1)) e.preventDefault();
  }
});

// ── 補全：開頭打 / 列斜線指令與 skill，任何位置打 @ 列 cwd 底下的檔案 ──
const cpEl = document.getElementById('completion');
let cp = null;          // { kind, start, end, items:[{label, insert, desc, scope}], idx }
let cpSeq = 0;          // 打字很快時，只認最後一次查詢的結果
let cmdCache = null;    // { cwd, at, list }
const SCOPE_LABEL = { project: '專案', user: '個人', builtin: '' };

function tokenAtCaret() {
  const pos = promptInput.selectionStart;
  if (pos !== promptInput.selectionEnd) return null;
  const before = promptInput.value.slice(0, pos);
  let m = /^\/([\w:.-]*)$/.exec(before);           // 斜線指令只認整段開頭，跟 CC 一樣
  if (m) return { kind: '/', q: m[1], start: 0, end: pos };
  m = /(^|\s)@([^\s@]*)$/.exec(before);
  if (m) return { kind: '@', q: m[2], start: pos - m[2].length - 1, end: pos };
  return null;
}

async function loadCommands() {
  if (cmdCache && cmdCache.cwd === cwd && Date.now() - cmdCache.at < 60000) return cmdCache.list;
  const r = await fetch('/api/commands?cwd=' + encodeURIComponent(cwd), { headers: { 'x-access-token': TOKEN } });
  const list = r.ok ? (await r.json()).commands : [];
  // /clear 在網頁上由前端自己處理（開新對話），確保清單裡一定有
  if (!list.some(c => c.name === 'clear')) list.push({ name: 'clear', desc: '開新對話', scope: 'builtin' });
  cmdCache = { cwd, at: Date.now(), list };
  return list;
}

async function updateCompletion() {
  const tok = tokenAtCaret();
  const seq = ++cpSeq;
  if (!tok || isComposing) { closeCompletion(); return; }
  let items = [];
  try {
    if (tok.kind === '/') {
      const q = tok.q.toLowerCase();
      items = (await loadCommands())
        .filter(c => c.name.toLowerCase().includes(q))
        .sort((a, b) => b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q))
        .slice(0, 60)
        .map(c => ({ label: '/' + c.name, insert: '/' + c.name + ' ', desc: c.desc, scope: SCOPE_LABEL[c.scope] || '' }));
    } else {
      await new Promise(r => setTimeout(r, 120));   // 等手停一下再查，不要每個字都掃
      if (seq !== cpSeq) return;
      const r = await fetch(`/api/fs/complete?cwd=${encodeURIComponent(cwd)}&q=${encodeURIComponent(tok.q)}`,
        { headers: { 'x-access-token': TOKEN } });
      const paths = r.ok ? (await r.json()).items : [];
      items = paths.map(p => ({ label: p, insert: '@' + p + (p.endsWith('/') ? '' : ' '), desc: '', scope: '' }));
    }
  } catch { items = []; }
  if (seq !== cpSeq) return;
  if (!items.length) { closeCompletion(); return; }
  cp = { ...tok, items, idx: 0 };
  renderCompletion();
}

function renderCompletion() {
  if (!cp) return;
  cpEl.innerHTML = '';
  cp.items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'cp-item' + (i === cp.idx ? ' active' : '');
    row.innerHTML = `<span class="cp-name"></span><span class="cp-desc"></span><span class="cp-scope"></span>`;
    row.querySelector('.cp-name').textContent = it.label;
    row.querySelector('.cp-desc').textContent = it.desc || '';
    row.querySelector('.cp-scope').textContent = it.scope || '';
    // mousedown 而不是 click：click 前 textarea 會先 blur 把清單關掉
    row.addEventListener('mousedown', ev => { ev.preventDefault(); cp.idx = i; acceptCompletion(); });
    cpEl.appendChild(row);
  });
  cpEl.classList.remove('hidden');
  cpEl.querySelector('.cp-item.active')?.scrollIntoView({ block: 'nearest' });
}

function closeCompletion() {
  cp = null;
  cpEl.classList.add('hidden');
  cpEl.innerHTML = '';
}

function acceptCompletion() {
  if (!cp) return;
  const it = cp.items[cp.idx];
  const v = promptInput.value;
  const nv = v.slice(0, cp.start) + it.insert + v.slice(cp.end);
  const caret = cp.start + it.insert.length;
  closeCompletion();
  promptInput.value = nv;
  promptInput.setSelectionRange(caret, caret);
  histIdx = -1;
  autosize(); refreshSendBtn(); saveDraft();
  promptInput.focus();
  if (it.insert.endsWith('/')) updateCompletion();   // 選的是目錄：接著列它底下的
}

// ── 夾圖：貼上、拖進輸入框、或按 📎 選檔 ──
const IMG_OK = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const IMG_MAX_EDGE = 1568;              // API 建議的長邊上限，再大也只是被伺服器端縮
const IMG_MAX_BYTES = 3.5 * 1024 * 1024;

function blobToB64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}

// 太大的縮下來；HEIC 之類 API 不收的格式順手轉成 JPEG
async function prepareImage(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('瀏覽器無法解碼這張圖'));
    i.src = url;
  });
  const scale = Math.min(1, IMG_MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
  if (scale === 1 && IMG_OK.includes(file.type) && file.size <= IMG_MAX_BYTES) {
    return { media_type: file.type, data: await blobToB64(file), url };
  }
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const draw = (bg) => {
    const g = c.getContext('2d');
    if (bg) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }   // JPEG 沒透明，墊白底免得變黑
    g.drawImage(img, 0, 0, c.width, c.height);
  };
  const toBlob = (type) => new Promise(r => c.toBlob(r, type, 0.88));
  let media_type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
  draw(media_type === 'image/jpeg');
  let blob = await toBlob(media_type);
  if (media_type === 'image/png' && blob.size > IMG_MAX_BYTES) {
    media_type = 'image/jpeg'; draw(true); blob = await toBlob(media_type);
  }
  return { media_type, data: await blobToB64(blob), url };
}

async function addImageFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    if (attachments.length >= 10) { appendSysMsg('⚠ 一次最多夾 10 張圖'); break; }
    try { attachments.push(await prepareImage(f)); }
    catch (e) { appendSysMsg('⚠ 圖片讀取失敗：' + e.message); }
  }
  renderAttachments();
  refreshSendBtn();
}

function renderAttachments() {
  const box = document.getElementById('attachments');
  box.innerHTML = '';
  attachments.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'att';
    el.innerHTML = `<img alt=""><button class="att-x" title="移除">✕</button>`;
    el.querySelector('img').src = a.url;
    el.querySelector('.att-x').onclick = () => {
      URL.revokeObjectURL(a.url);
      attachments.splice(i, 1);
      renderAttachments(); refreshSendBtn();
    };
    box.appendChild(el);
  });
}

promptInput.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.items || [])]
    .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
    .map(it => it.getAsFile()).filter(Boolean);

  addImageFiles(files);
});
document.getElementById('image-input').addEventListener('change', e => {

});
{

function setStreaming(on) {
  streaming = on;
  btnAbort.classList.toggle('hidden', !on);

function appendMessage(role, content, images) {
  document.getElementById('empty-state')?.remove();
  const container = document.getElementById('messages');
