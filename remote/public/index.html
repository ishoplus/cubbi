  b.className = 'btn-tool' + (cls ? ' ' + cls : '');
  b.textContent = label;
  b.onclick = async () => { b.disabled = true; try { await fn(b); } finally { b.disabled = false; } };
  return b;
}
function inboxCard(i) {
  const card = document.createElement('div');
  card.className = 'ib-card k-' + i.kind;
  const who = i.name || i.title || (i.cwd || '').split('/').pop() || '對話';
  card.innerHTML = `<div class="ib-head"><span class="chip ib-kind">${IB_KIND[i.kind] || i.kind}</span><span class="ib-who"></span><span class="ib-at">${ibAgo(i.at)}</span></div><div class="ib-sub"></div>`;
  card.querySelector('.ib-who').textContent = who;
  const sub = card.querySelector('.ib-sub');
  const acts = document.createElement('div');
  acts.className = 'ib-actions';
  if (i.kind === 'ask' && i.answerable) {
    sub.textContent = i.cwd || '';
    // 跟對話裡同一張提問卡：允許／總是允許（記進專案的 .claude/settings.local.json）／拒絕、或選答案
    card.appendChild(buildAskCard(i.ask, async (payload) => { await respondToAsk(i.runId, i.ask.requestId, payload); setTimeout(loadInbox, 500); }));
    if (i.sid) acts.appendChild(ibButton('開對話', '', () => openConv(i)));
  } else if (i.kind === 'ask') {
    // 終端機開的對話舉手（hooks 看到的）：這裡答不了，到終端機或辦公室看
    sub.textContent = `${i.ask?.question || i.ask?.tool || '需要你決定'} · ${i.cwd || ''}`;
    acts.appendChild(ibButton('到辦公室看', 'primary', () => { location.href = '/space.html'; }));
    acts.appendChild(ibButton('知道了', '', () => ibDismiss(i.key)));
  } else if (i.kind === 'idea') {
    // 提案部的新提案：在這裡就能判；要的會進白板的 Todo，到白板按開工
    const p = i.idea || {};
    sub.textContent = `${p.kind === 'project' ? '新項目' : p.project || ''} · 約 ${p.days || '?'} 天 · ${i.ideaId}`;
    const body = document.createElement('div');
    body.className = 'ib-idea';
    body.innerHTML = `<div class="ib-hook"></div><div class="ib-sub"></div>`;
    body.querySelector('.ib-hook').textContent = p.hook || '';
    body.querySelector('.ib-sub').textContent = [p.see && '做完會看到：' + p.see, p.why_now && '為什麼現在：' + p.why_now, p.risk && '風險：' + p.risk].filter(Boolean).join('\n');
    card.appendChild(body);
    const judge = async (verdict, note = '') => {
      try { await ibApi(`/space/ideas/${encodeURIComponent(i.ideaId)}/verdict`, { method: 'POST', body: JSON.stringify({ verdict, note }) }); toastMsg({ 要: '收到，放進 Todo', 不要: '拿掉了', 改: '記下了，下一批照這個改' }[verdict]); }
      catch (e) { alert(e.message); }
      loadInbox();
    };
    acts.appendChild(ibButton('要', 'primary', () => judge('要')));
    acts.appendChild(ibButton('不要', '', () => judge('不要')));
    acts.appendChild(ibButton('改…', '', () => { const n = prompt('想怎麼改？（下一批會照這個重寫）'); if (n?.trim()) return judge('改', n.trim()); }));
    acts.appendChild(ibButton('到白板看', '', () => { location.href = '/space.html?ideas=1'; }));
  } else if (i.kind === 'deliv') {
    sub.textContent = `${i.deliv?.title || ''}${i.deliv?.count > 1 ? ` 等 ${i.deliv.count} 樣` : ''} · ${i.cwd || ''}`;
    acts.appendChild(ibButton('開對話', 'primary', () => openConv(i)));
    acts.appendChild(ibButton('到辦公室看成品', '', () => { location.href = '/space.html'; }));
    acts.appendChild(ibButton('收下', '', async () => { await ibApi('/space/inbox/accept', { method: 'POST', body: JSON.stringify({ sid: i.sid, turn: i.turn }) }).catch(() => {}); toastMsg('收下了'); loadInbox(); }));
  } else if (i.kind === 'done') {
    sub.textContent = i.cwd || '';
    acts.appendChild(ibButton('開對話', 'primary', () => openConv(i)));
    acts.appendChild(ibButton('知道了', '', () => markSeen(i.sid)));
  } else if (i.kind === 'review') {
    sub.innerHTML = `<span class="ib-branch"></span> · ${i.commits} 個 commit · <span class="d-add">+${i.add}</span> <span class="d-del">−${i.del}</span> · ${i.files} 個檔${i.dirty ? ` · <b class="d-del">${i.dirty} 個沒 commit</b>` : ''}`;
    sub.querySelector('.ib-branch').textContent = `${i.repo} · ${i.branch} → ${i.base}`;
    const ev = document.createElement('div');
    ev.className = 'ib-checks';
    const e = i.evidence || {};
    ev.innerHTML = e.state === 'running' ? '<span class="chip">驗收中…</span>'
      : e.state === 'none' ? '<span class="chip">還沒驗收</span>'
      : e.state === 'nochecks' ? '<span class="chip">沒設驗收指令</span>'
      : (i.checks || []).map(c => `<span class="chip ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'} ${escHtml(c.name)}</span>`).join('');
    ev.onclick = () => openDelivery(i);
    card.appendChild(ev);
    acts.appendChild(ibButton('看改動', 'primary', () => openDelivery(i)));
    acts.appendChild(ibButton('合併', '', () => ibMerge(i)));
    acts.appendChild(ibButton('打回', '', () => ibReject(i)));
    acts.appendChild(ibButton('開對話', '', () => openConv(i)));
    acts.appendChild(ibButton('稍後', '', () => ibDismiss(i.key)));
  } else if (i.kind === 'stuck') {
    sub.textContent = `${Math.round(i.idleMs / 60000)} 分鐘沒動靜 · ${i.cwd || ''}`;
    acts.appendChild(ibButton('開對話', 'primary', () => openConv(i)));
    acts.appendChild(ibButton('停這一輪', 'danger', async () => { await fetch(`/api/claude/${i.runId}/abort`, { method: 'POST', headers: { 'x-access-token': TOKEN } }); setTimeout(loadInbox, 800); }));
    acts.appendChild(ibButton('知道了', '', () => ibDismiss(i.key)));
  } else if (i.kind === 'ended') {
    sub.textContent = i.reasonText || i.reason || '';
    if (i.sid) acts.appendChild(ibButton('開對話接著做', 'primary', () => openConv(i)));
    acts.appendChild(ibButton('知道了', '', () => ibDismiss(i.key)));
  } else if (i.kind === 'task') {
    sub.textContent = `${STATUS_LABEL[i.status] || i.status} · ${i.cwd || ''}`;
    acts.appendChild(ibButton('開任務', 'primary', () => { switchView('tasks'); setTimeout(() => selectTask(i.taskId), 300); }));
    acts.appendChild(ibButton('知道了', '', () => ibDismiss(i.key)));
  }
  card.appendChild(acts);
  return card;
}

async function ibMerge(i) {
  if (!confirm(`把 ${i.branch} 合併進 ${i.repo} 的 ${i.base}？（只動本機，不會 push）`)) return;
  try { const r = await ibApi(`/worktrees/${i.sid}/merge`, { method: 'POST' }); toastMsg(`✓ 已合併 ${r.commits} 個 commit`); }
  catch (e) { alert('沒合併：' + e.message); }
  closeModal(); loadInbox();
}
async function ibReject(i) {
  const fb = prompt('要它改什麼？（會送進那段對話，它改完會再交件）');
  if (!fb?.trim()) return;
  try { await ibApi(`/worktrees/${i.sid}/reject`, { method: 'POST', body: JSON.stringify({ feedback: fb }) }); toastMsg('已打回，它在改了'); }
  catch (e) { alert('送不出去：' + e.message); }
  closeModal(); loadInbox();
}
async function ibDiscard(i) {
  if (!confirm(`丟棄分支 ${i.branch}？worktree 和分支上的改動都會刪掉，不能復原。`)) return;
  try { await ibApi(`/worktrees/${i.sid}/discard`, { method: 'POST' }); toastMsg('已丟棄'); }
  catch (e) { alert('丟不掉：' + e.message); }
  closeModal(); loadInbox();
}
function toastMsg(t) {
  const el = document.createElement('div');
  el.className = 'ib-toast'; el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// 交付詳情：commit、驗收結果（可展開看輸出）、改了哪些檔、彩色 diff
function diffHtml(text) {
  return text.split('\n').map(l => {
    const c = l.startsWith('diff --git') ? 'dl-file' : l.startsWith('@@') ? 'dl-hunk' : (l.startsWith('+++') || l.startsWith('---')) ? 'dl-meta'
      : l.startsWith('+') ? 'dl-add' : l.startsWith('-') ? 'dl-del' : '';
    return `<span class="${c}">${escHtml(l) || ' '}</span>`;
  }).join('\n');
}
async function openDelivery(i) {
  let d;
  try { d = await ibApi(`/worktrees/${i.sid}`); } catch (e) { alert(e.message); return; }
  const dl = d.delivery || { commits: [], files: [] };
  const ev = d.evidence && d.evidence.head === dl.head ? d.evidence : null;
  const back = showModal(`<div class="modal ib-modal"><div class="modal-head"><span class="ib-mtitle"></span><button class="btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="ib-sec"><b>commit</b>${dl.commits.length ? dl.commits.map(c => `<div class="ib-commit"><code>${c.sha.slice(0, 7)}</code> ${escHtml(c.subject)}</div>`).join('') : '<div class="ib-sub">還沒有 commit</div>'}
        ${dl.dirty?.length ? `<div class="d-del">還沒 commit：${dl.dirty.map(escHtml).join('、')}</div>` : ''}</div>
      <div class="ib-sec"><div><b>驗收</b> <span class="ib-sub">（${d.guessed ? '從專案猜的' : '這個專案設定的'}：${d.checks.map(c => escHtml(c.cmd)).join('、') || '沒有'}）</span></div>
        <div class="ib-evs">${ev ? ev.results.map((r, k) => `<details><summary><span class="chip ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'} ${escHtml(r.name)}</span> <span class="ib-sub">${(r.ms / 1000).toFixed(1)}s · ${escHtml(r.cmd)}</span></summary><pre class="ib-tail">${escHtml(r.tail || '（沒有輸出）')}</pre></details>`).join('') + (ev.running ? '<div class="ib-sub">驗收中…</div>' : '') : '<div class="ib-sub">還沒驗收這個版本</div>'}</div>
        <div class="ib-actions"><button class="btn-tool" data-a="run">重跑驗收</button><button class="btn-tool" data-a="edit">改驗收指令</button></div></div>
      <div class="ib-sec"><div><b>改了 ${dl.files.length} 個檔</b> <span class="d-add">+${dl.add || 0}</span> <span class="d-del">−${dl.del || 0}</span></div>
        <div class="ib-files">${dl.files.map(f => `<div class="ib-file" data-f="${escHtml(f.file)}"><span class="d-add">+${f.add}</span> <span class="d-del">−${f.del}</span> ${escHtml(f.file)}${f.untracked ? ' <span class="ib-sub">（新檔，沒 commit）</span>' : ''}</div>`).join('')}</div></div>
      <pre class="ib-diff">載入中…</pre>
    </div>
    <div class="modal-foot ib-actions"><button class="btn-tool primary" data-a="merge">合併進 ${escHtml(d.worktree.base)}</button><button class="btn-tool" data-a="reject">打回</button><button class="btn-tool danger" data-a="discard">丟棄分支</button></div></div>`);
  back.querySelector('.ib-mtitle').textContent = `${i.name || i.title || ''} · ${d.worktree.branch}`;
  const pre = back.querySelector('.ib-diff');
  const showDiff = async (file) => {
    pre.textContent = '載入中…';
    try { pre.innerHTML = diffHtml(await ibApi(`/worktrees/${i.sid}/diff${file ? '?file=' + encodeURIComponent(file) : ''}`)); } catch (e) { pre.textContent = e.message; }
  };
  back.querySelectorAll('.ib-file').forEach(el => el.onclick = () => { back.querySelectorAll('.ib-file').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); showDiff(el.dataset.f); });
  back.querySelector('[data-a=run]').onclick = async () => { try { await ibApi(`/worktrees/${i.sid}/checks/run`, { method: 'POST' }); toastMsg('驗收中…'); closeModal(); setTimeout(() => openDelivery(i), 1500); } catch (e) { alert(e.message); } };
  back.querySelector('[data-a=edit]').onclick = async () => {
    const cur = d.checks.map(c => c.cmd).join('\n');
    const t = prompt('這個專案的驗收指令，一行一個（在分支的資料夾裡跑；全部清空＝不驗收）', cur);
    if (t == null) return;
    try { await ibApi(`/worktrees/${i.sid}/checks`, { method: 'PUT', body: JSON.stringify({ checks: t.split('\n').map(cmd => ({ cmd })) }) }); closeModal(); openDelivery(i); } catch (e) { alert(e.message); }
  };
  back.querySelector('[data-a=merge]').onclick = () => ibMerge(i);
  back.querySelector('[data-a=reject]').onclick = () => ibReject(i);
  back.querySelector('[data-a=discard]').onclick = () => ibDiscard(i);
  showDiff(null);
}

// 這段對話有分支：session 旁邊顯示分支名（點了看交付）
async function updateBranchBadge() {
  const el = document.getElementById('session-branch');
  if (!el) return;
  el.hidden = true;
  if (!sessionId) return;
  const sid = sessionId;
  try {
    const d = await ibApi(`/worktrees/${sid}`);
    if (sid !== sessionId) return;
    el.textContent = '⑂ ' + d.worktree.branch.replace(/^cw\//, '');
    el.title = `在分支 ${d.worktree.branch} 做（worktree ${d.worktree.path}）；點一下看改動`;
    el.onclick = () => openDelivery({ sid, name: '', title: d.worktree.title, branch: d.worktree.branch, repo: '', base: d.worktree.base });
    el.hidden = false;
  } catch {}
}

function switchView(v) {
  currentView = v;
  document.body.classList.toggle('view-tasks', v === 'tasks');
  document.body.classList.toggle('view-inbox', v === 'inbox');
  document.getElementById('tasks-view').classList.toggle('active', v === 'tasks');
  document.getElementById('inbox-view').classList.toggle('active', v === 'inbox');
  document.getElementById('nav-chat').classList.toggle('active', v === 'chat');
  document.getElementById('nav-tasks').classList.toggle('active', v === 'tasks');
  document.getElementById('nav-inbox').classList.toggle('active', v === 'inbox');
  if (v === 'inbox') { renderInbox(); loadInbox(); }
  localStorage.setItem('cg_view', v);
  if (v === 'tasks') {
    loadTasks();
    // 列表靠輪詢就夠了（只有狀態摘要）；詳情才值得開一條 SSE
    if (!taskPollTimer) taskPollTimer = setInterval(() => { if (currentView === 'tasks') loadTasks(); }, 5000);
  } else if (taskPollTimer) {
    clearInterval(taskPollTimer); taskPollTimer = null;
  }
}

function taskApi(path, opts = {}) {
  return fetch('/api/tasks' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-access-token': TOKEN, ...(opts.headers || {}) },
  }).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok || data.error) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  });
}

// ── Tasks: 列表 ───────────────────────────────────────────────────────────────
async function loadTasks() {
  try {
    const d = await taskApi('/');
    taskList = d.tasks;
    maxAutoRetry = d.maxAutoRetry ?? maxAutoRetry;
    document.getElementById('task-cap').textContent = `${d.running}/${d.maxConcurrent}`;
    renderTaskList();
    // 已被刪掉的話收掉詳情
    if (selectedTaskId && !taskList.some(t => t.id === selectedTaskId)) closeTaskDetail();
  } catch (e) { console.warn('[tasks] 載入失敗', e.message); }
}

function relPath(p) {
  if (!workRoot || !p) return p || '';
  return p === workRoot ? '/' : p.slice(workRoot.length).replace(/^\//, '');
}

function renderTaskList() {
  const box = document.getElementById('task-list');
  if (!taskList.length) {
    box.innerHTML = '<div class="tasks-empty">還沒有任務。<br>按「＋ 新任務」選一個目錄、寫下目標，<br>Claude 會在背景執行並回報進度。</div>';
    return;
  }
  box.innerHTML = taskList.map(t => `
    <div class="task-card ${t.id === selectedTaskId ? 'selected' : ''}" onclick="selectTask('${t.id}')">
      <div class="tc-top">
        <span class="tc-name">${escHtml(t.name)}</span>
        <span class="chip s-${t.status}">${STATUS_LABEL[t.status] || t.status}</span>
      </div>
      <div class="tc-dir">${escHtml(relPath(t.cwd))}</div>
      <div class="tc-sub">${escHtml(taskSubtitle(t))}</div>
    </div>`).join('');
}

function taskSubtitle(t) {
  if (t.status === 'awaiting_permission' && t.pendingAsk) return `⏸ ${t.pendingAsk.toolName}：${t.pendingAsk.why}`;
  if (t.status === 'awaiting_review') return `📋 ${t.review?.summary || '等待你驗收'}`;
  if (t.status === 'failed') return `✕ ${t.error || '執行失敗'}`;
  if (t.status === 'done') return `✓ ${t.note || '已完成'}`;
  if (t.status === 'running' || t.status === 'reviewing') {
    const p = t.progress || {};
    return `${p.lastTool ? p.lastTool + ' · ' : ''}${p.tools || 0} 次工具呼叫`;
  }
  return t.note || STATUS_LABEL[t.status] || '';
}

// ── Tasks: 詳情 ───────────────────────────────────────────────────────────────
function selectTask(id) {
  selectedTaskId = id;
  document.getElementById('task-detail-empty').style.display = 'none';
  document.getElementById('task-detail').classList.add('active');
  document.getElementById('tasks-view').classList.add('detail-open');
  document.getElementById('task-log').innerHTML = '';
  renderTaskList();
  openTaskStream(id);
}

function closeTaskDetail() {
  selectedTaskId = null;
  if (taskSse) { taskSse.close(); taskSse = null; }
  document.getElementById('task-detail').classList.remove('active');
  document.getElementById('task-detail-empty').style.display = 'flex';
  document.getElementById('tasks-view').classList.remove('detail-open');
  renderTaskList();
}

function openTaskStream(id) {
  if (taskSse) { taskSse.close(); taskSse = null; }
  const es = new EventSource(apiUrl(`/api/tasks/${id}/stream`));
  taskSse = es;
  es.onmessage = e => {
    if (taskSse !== es) return; // 已經切到別的任務
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'task') {
      const i = taskList.findIndex(t => t.id === msg.task.id);
      if (i >= 0) taskList[i] = msg.task; else taskList.unshift(msg.task);
      renderTaskDetail(msg.task);
      renderTaskList();
    } else if (msg.type === 'event') {
      appendTaskLog(msg.data, msg.replay);
    } else if (msg.type === 'replay-done') {
      const body = document.getElementById('task-detail-body');
      body.scrollTop = body.scrollHeight;
    }
  };
  es.onerror = () => { /* EventSource 會自己重連 */ };
}

function renderTaskDetail(t) {
  document.getElementById('td-name').textContent = t.name;
  const chip = document.getElementById('td-status');
  chip.className = 'chip s-' + t.status;
  chip.textContent = STATUS_LABEL[t.status] || t.status;

  const p = t.progress || {};
  const reviewLabel = { ai: 'AI 評審', manual: '人工確認', none: '不評審' }[t.reviewMode] || t.reviewMode;
  document.getElementById('td-meta').innerHTML = [
    `目錄 <b>${escHtml(relPath(t.cwd))}</b>`,
    `評審 <b>${reviewLabel}</b>`,
    t.model ? `模型 <b>${escHtml(t.model)}</b>` : '',
    `輪次 <b>${t.attempts || 0}</b>`,
    t.autoRetries ? `自動續修 <b>${t.autoRetries}/${maxAutoRetry}</b>` : '',
    `工具 <b>${p.tools || 0}</b>`,
    p.costUsd ? `花費 <b>$${p.costUsd.toFixed(4)}</b>` : '',
    t.startedAt ? `開始 <b>${new Date(t.startedAt).toLocaleString('zh-TW', { hour12: false })}</b>` : '',
  ].filter(Boolean).join('');

  document.getElementById('td-goal').textContent = t.goal
    + (t.reviewCriteria ? `\n\n【驗收標準】\n${t.reviewCriteria}` : '')
    + (t.verifyCmd ? `\n\n【驗收指令】\n${t.verifyCmd}` : '');

  const rbox = document.getElementById('td-review-box');
  if (t.review) {
    rbox.style.display = '';
    const v = { pass: '✓ 通過', fail: '✕ 未通過', unknown: '? 無結論' }[t.review.verdict] || t.review.verdict;
    document.getElementById('td-review').innerHTML =
      `<b>${v}</b>${t.review.gate === 'command' ? '（驗收指令擋下）' : ''}${t.review.humanApproved ? '（你人工通過）' : ''}\n${escHtml(t.review.summary || '')}` +
      (t.review.issues?.length ? '\n' + t.review.issues.map(s => '• ' + escHtml(s)).join('\n') : '');
  } else rbox.style.display = 'none';

  renderTaskActions(t);
  renderActionCard(t);
}

function renderTaskActions(t) {
  const busy = ['queued', 'running', 'reviewing', 'awaiting_permission'].includes(t.status);
  const btns = [];
  if (busy) btns.push(`<button class="btn-tool danger" onclick="taskAction('${t.id}','stop')">■ 停止</button>`);
  else {
    if (t.status === 'interrupted' && t.sessionId)
      btns.push(`<button class="btn-tool primary" onclick="taskAction('${t.id}','resume')">▶ 續跑</button>`);
    btns.push(`<button class="btn-tool ${t.status === 'idle' ? 'primary' : ''}" onclick="taskAction('${t.id}','start')">${t.status === 'idle' ? '▶ 啟動' : '↻ 重跑'}</button>`);
  }
  btns.push(`<button class="btn-tool danger" onclick="deleteTask('${t.id}')">🗑</button>`);
  document.getElementById('task-detail-actions').innerHTML = btns.join('');
}

// 需要人介入時，把待辦擺在最上面——不要讓人自己去日誌裡找為什麼卡住
function renderActionCard(t) {
  const slot = document.getElementById('td-action-slot');
  if (t.status === 'awaiting_permission' && t.pendingAsk) {
    const a = t.pendingAsk;
    const arg = a.input?.command || a.input?.file_path || a.input?.url || a.input?.path || '';
    slot.innerHTML = `
      <div class="action-card">
        <div class="ac-title">⏸ 需要你授權：${escHtml(a.displayName || a.toolName)}</div>
        <div class="ac-detail">${escHtml(a.why || '')}</div>
        ${arg ? `<code>${escHtml(String(arg))}</code>` : ''}
        <div class="ac-row">
          <button class="btn-tool primary" onclick="respondTask('${t.id}','allow',false)">允許一次</button>
          <button class="btn-tool" onclick="respondTask('${t.id}','allow',true)">一律允許此工具</button>
          <button class="btn-tool danger" onclick="respondTask('${t.id}','deny')">拒絕</button>
        </div>
      </div>`;
    return;
  }
  if (t.status === 'awaiting_review') {
    const issues = t.review?.issues?.length
      ? `<ul>${t.review.issues.map(s => `<li>${escHtml(s)}</li>`).join('')}</ul>` : '';
    slot.innerHTML = `
      <div class="action-card">
        <div class="ac-title">📋 ${t.autoRetries >= maxAutoRetry ? `自動續修 ${maxAutoRetry} 輪仍未通過` : '等待你驗收'}</div>
        <div class="ac-detail">${escHtml(t.review?.summary || t.note || '任務已執行完畢，請確認結果。')}</div>
        ${issues}
        <textarea id="review-feedback" rows="2" placeholder="打回時要補充的修正意見（可留空）"></textarea>
        <div class="ac-row">
          <button class="btn-tool primary" onclick="reviewTask('${t.id}','approve')">✓ 驗收通過</button>
          <button class="btn-tool" onclick="reviewTask('${t.id}','reject')">↻ 打回續修</button>
        </div>
      </div>`;
    return;
  }
  if (t.status === 'failed' && t.error) {
    slot.innerHTML = `<div class="action-card"><div class="ac-title">✕ 執行失敗</div><div class="ac-detail">${escHtml(t.error)}</div></div>`;
    return;
  }
  slot.innerHTML = '';
}

function appendTaskLog(ev, replay) {
  if (ev.kind === 'raw') return;
  const box = document.getElementById('task-log');
  const body = document.getElementById('task-detail-body');
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;

  const time = new Date(ev.ts || Date.now()).toLocaleTimeString('zh-TW', { hour12: false });
  let html;
  switch (ev.kind) {
    case 'tool':
      html = `<span class="tn">${escHtml(ev.tool)}</span> <span class="ta">${escHtml(ev.text || '')}</span>`; break;
    case 'ask':
      html = `⏸ 需要授權 ${escHtml(ev.tool)} — ${escHtml(ev.text || '')}`; break;
    case 'auto-deny':
      html = `⊘ 自動拒絕 ${escHtml(ev.tool)} — ${escHtml(ev.text || '')}`; break;
    case 'verify':
      html = `${ev.ok ? '✓' : '✕'} ${escHtml(ev.text || '')}`
        + (ev.out ? `<pre class="lg-out">${escHtml(ev.out)}</pre>` : '');
      break;
    case 'decision':
      html = `👤 ${escHtml(ev.text || '')}`; break;
    case 'result':
      html = ev.isError ? `✕ ${escHtml(ev.text || '執行失敗')}`
        : `✓ 本輪結束${ev.turns ? `（${ev.turns} 輪` : ''}${ev.costUsd ? `，$${ev.costUsd.toFixed(4)}` : ''}${ev.turns ? '）' : ''}`;
      break;
    case 'phase': case 'status':
      html = `— ${escHtml(ev.text || '')} —`; break;
    default:
      html = escHtml(ev.text || '');
  }
  if (!html) return;

  const div = document.createElement('div');
  div.className = 'lg lg-' + ev.kind;
  div.innerHTML = `<span class="lg-time">${time}</span><span class="lg-body">${html}</span>`;
  box.appendChild(div);
  if (!replay && atBottom) body.scrollTop = body.scrollHeight;
}

// ── Tasks: 動作 ───────────────────────────────────────────────────────────────
async function taskAction(id, action) {
  try { await taskApi(`/${id}/${action}`, { method: 'POST' }); loadTasks(); }
  catch (e) { alert('操作失敗：' + e.message); }
}

async function deleteTask(id) {
  const t = taskList.find(x => x.id === id);
  if (!confirm(`確定刪除任務「${t?.name || id}」？執行中會先停止，紀錄也會一併清除。`)) return;
  try {
    await taskApi(`/${id}`, { method: 'DELETE' });
    if (selectedTaskId === id) closeTaskDetail();
    loadTasks();
  } catch (e) { alert('刪除失敗：' + e.message); }
}

async function respondTask(id, behavior, always) {
  const t = taskList.find(x => x.id === id);
  try {
    await taskApi(`/${id}/respond`, {
      method: 'POST',
      body: JSON.stringify({ requestId: t?.pendingAsk?.requestId, behavior, always }),
    });
  } catch (e) { alert('回覆失敗：' + e.message); }
}

async function reviewTask(id, decision) {
  const fb = document.getElementById('review-feedback')?.value || '';
  try { await taskApi(`/${id}/review`, { method: 'POST', body: JSON.stringify({ decision, feedback: fb }) }); loadTasks(); }
  catch (e) { alert('操作失敗：' + e.message); }
}

// ── Modal 基礎 ────────────────────────────────────────────────────────────────
const modalStack = [];

function showModal(html) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = html;
  back.addEventListener('click', e => { if (e.target === back) closeModal(); });
  document.body.appendChild(back);
  modalStack.push(back);
  return back;
}

function closeModal() {
  const m = modalStack.pop();
  if (m) m.remove();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length) closeModal();
});

// ── Tasks: 建任務前先談清楚 ───────────────────────────────────────────────────
//
// 一句「補一下測試」直接開任務，跑出來多半不是你要的。先讓 Claude 看過專案、
// 反問幾題，談定後把「目標 + 驗收標準」一起回填。談出來的東西你還能改，
// 按下「建立」才真的變成任務。

let clarify = null;   // { sessionId, round, maxRounds, cost, questions }

function clarifyBox() { return document.getElementById('tf-chat'); }

function clarifyStatus(msg, busy) {
  const el = document.getElementById('tf-chat-status');
  if (el) el.textContent = msg;
  clarifyBox().querySelectorAll('button, input').forEach(b => { b.disabled = !!busy; });
}

async function startClarify() {
  const seed = document.getElementById('tf-goal').value.trim();
  const hint = document.getElementById('tf-talk-hint');
  if (!seed) { hint.textContent = '先寫一句你想做什麼（一句話就好），才有得談。'; return; }

  clarify = { sessionId: null, round: 0, maxRounds: 5, cost: 0, questions: [] };
  const box = clarifyBox();
  box.className = 'on';
  box.innerHTML = '<div class="cq-head" id="tf-chat-status">Claude 正在把這個專案看過一遍，準備問題中…（第一輪較久，約一兩分鐘）</div>';
  document.getElementById('tf-talk').disabled = true;
  hint.textContent = '';
  await postClarify({ seed });
}

async function postClarify(extra) {
  const body = {
    name: document.getElementById('tf-name').value.trim(),
    cwd: document.getElementById('tf-cwd').value,
    model: document.getElementById('tf-model').value,
    sessionId: clarify.sessionId,
    round: clarify.round,
    ...extra,
  };
  try {
    const d = await taskApi('/clarify', { method: 'POST', body: JSON.stringify(body) });
    clarify.sessionId = d.sessionId || clarify.sessionId;
    clarify.round = d.round || clarify.round;
    clarify.maxRounds = d.maxRounds || clarify.maxRounds;
    clarify.cost += d.costUsd || 0;
    if (d.done) return finishClarify(d);
    clarify.questions = d.questions || [];
    renderClarify(d.overLimit);
  } catch (e) {
    clarifyStatus('談不下去了：' + e.message, false);
    const box = clarifyBox();
    if (!box.querySelector('.cq-row')) {
      box.insertAdjacentHTML('beforeend',
        '<div class="cq-row"><button class="btn-tool" onclick="closeClarify()">收起</button></div>');
    }
  }
}

function renderClarify(overLimit) {
  const qs = clarify.questions;
  const html = qs.map((q, i) => `
    <div class="cq" data-i="${i}">
      <div class="cq-q">${i + 1}. ${escHtml(q.q)}</div>
      ${q.why ? `<div class="cq-why">${escHtml(q.why)}</div>` : ''}
      ${q.options?.length ? `<div class="cq-opts">${q.options.map(o =>
        `<button type="button" class="cq-opt" onclick="pickClarifyOpt(this)" data-v="${escHtml(o)}">${escHtml(o)}</button>`
      ).join('')}</div>` : ''}
      <input class="cq-free" placeholder="${q.options?.length ? '或自己補充…' : '你的回答…'}">
    </div>`).join('');

  clarifyBox().innerHTML = `
    <div class="cq-head" id="tf-chat-status">第 ${clarify.round} 輪${overLimit ? '（已達上限，它還想問）' : ` / 上限 ${clarify.maxRounds}`}　${clarify.cost ? `已花 $${clarify.cost.toFixed(3)}` : ''}</div>
    ${html}
    <div class="cq-row">
      <button class="btn-tool primary" onclick="sendClarify(false)">送出回答</button>
      <button class="btn-tool" onclick="sendClarify(true)">不用問了，直接寫</button>
      <button class="btn-tool" onclick="closeClarify()">取消</button>
    </div>`;
}

function pickClarifyOpt(btn) {
  const wrap = btn.closest('.cq-opts');
  const on = btn.classList.contains('sel');
  wrap.querySelectorAll('.cq-opt').forEach(b => b.classList.remove('sel'));
  if (!on) btn.classList.add('sel');   // 再點一次可取消，改成只填自由輸入
}

async function sendClarify(finalize) {
  const answers = [...clarifyBox().querySelectorAll('.cq')].map((el, i) => {
    const picked = el.querySelector('.cq-opt.sel')?.dataset.v || '';
    const free = el.querySelector('.cq-free').value.trim();
    return { q: clarify.questions[i]?.q || '', a: [picked, free].filter(Boolean).join('；') };
  });
  clarifyStatus(finalize ? '收尾中，正在寫目標與驗收標準…' : 'Claude 正在消化你的回答…', true);
  await postClarify({ answers, finalize });
}

function finishClarify(d) {
  if (d.goal) document.getElementById('tf-goal').value = d.goal;
  if (d.criteria) document.getElementById('tf-criteria').value = d.criteria;
  if (d.verifyCmd) document.getElementById('tf-verify').value = d.verifyCmd;
  closeClarify();
  document.getElementById('tf-talk-hint').textContent =
    `談定了（${clarify.round} 輪${clarify.cost ? `，共 $${clarify.cost.toFixed(3)}` : ''}）。目標與驗收標準已填好，確認或再手改都可以。`;
}

function closeClarify() {
  const box = clarifyBox();
  box.className = '';
  box.innerHTML = '';
  document.getElementById('tf-talk').disabled = false;
}


async function submitTaskForm() {
  const payload = {
    name: document.getElementById('tf-name').value.trim(),
    cwd: document.getElementById('tf-cwd').value,
    goal: document.getElementById('tf-goal').value.trim(),
    reviewMode: document.getElementById('tf-review').value,
    reviewCriteria: document.getElementById('tf-criteria').value.trim(),
    verifyCmd: document.getElementById('tf-verify').value.trim(),
    model: document.getElementById('tf-model').value,
    autoStart: document.getElementById('tf-autostart').checked,
  };
  if (!payload.name) return alert('請填項目名稱');
  if (!payload.goal) return alert('請填項目目標');
  try {
    const d = await taskApi('/', { method: 'POST', body: JSON.stringify(payload) });
    closeModal();
    await loadTasks();
    selectTask(d.task.id);
  } catch (e) { alert('建立失敗：' + e.message); }
}

// ── Tasks: 目錄選擇器 ─────────────────────────────────────────────────────────
function pickTaskDir() {
  const cur = document.getElementById('tf-cwd').value || workRoot;
  openDirPicker(cur, path => { document.getElementById('tf-cwd').value = path; });
}

function openDirPicker(startPath, onPick) {
  const back = showModal(`
    <div class="modal" style="width:440px">
      <div class="modal-head">選擇目錄<button class="btn-icon" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="dirpick-cur" id="dp-cur"></div>
        <div class="dirpick-list" id="dp-list"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-tool" onclick="closeModal()">取消</button>
        <button class="btn-tool primary" id="dp-ok">選擇此目錄</button>
      </div>
    </div>`);

  let path = startPath;
  const load = async p => {
    try {
      const r = await fetch(apiUrl('/api/fs/ls', `&path=${encodeURIComponent(p)}`), { headers: { 'x-access-token': TOKEN } });
      const d = await r.json();
      if (d.error) return alert(d.error);
      path = d.path;
      back.querySelector('#dp-cur').textContent = d.path;
      const dirs = d.items.filter(i => i.isDir);
      back.querySelector('#dp-list').innerHTML =
        (d.parent ? `<div class="dirpick-item" data-p="${escHtml(d.parent)}">📁 ..</div>` : '') +
        (dirs.length
          ? dirs.map(i => `<div class="dirpick-item" data-p="${escHtml(i.path)}">📁 ${escHtml(i.name)}</div>`).join('')
          : '<div class="dirpick-item" style="color:var(--text-sub);cursor:default">（沒有子目錄）</div>');
      back.querySelectorAll('.dirpick-item[data-p]').forEach(el =>
        el.addEventListener('click', () => load(el.dataset.p)));
    } catch (e) { alert('讀取目錄失敗：' + e.message); }
  };
  back.querySelector('#dp-ok').addEventListener('click', () => { onPick(path); closeModal(); });
  load(startPath);
}

// ── Theme ─────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('cg_theme', next);
}
