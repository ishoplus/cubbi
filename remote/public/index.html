// token 數字太長會把那行系統訊息撐爆，過千就縮成 k
function fmtTok(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }

// 黏底：使用者在底部附近時，新輸出才自動跟到底；往上捲去看前面的就不拉回來（點 ↓ 或自己送出才回到黏底）
var stickBottom = true, touchingMessages = false, userLeft = false, notifyNewOutput = () => {};   // userLeft：使用者自己往上動過，要真的回到最底才恢復黏底
// 手指還按在對話區時一律不拉，不然輸出很快時往上拖不出 80px 就被拉回去

// 置底按鈕：離底部超過一個畫面高度的一半才出現；往上看時有新輸出就一定出現，並變成藍色帶紅點；位置跟著輸入框高度走
(() => {
  const c = document.getElementById('messages');
  const btn = document.getElementById('jump-bottom');
  const input = document.getElementById('input-area');
  let hasNew = false;
  const update = () => {
    const gap = c.scrollHeight - c.scrollTop - c.clientHeight;
    btn.classList.toggle('has-new', hasNew);
    btn.classList.toggle('hidden', !hasNew && gap < c.clientHeight / 2);
  };
  notifyNewOutput = () => { if (!hasNew) { hasNew = true; update(); } };
  c.addEventListener('scroll', () => {
    const gap = c.scrollHeight - c.scrollTop - c.clientHeight;
    stickBottom = gap < (userLeft ? 4 : 80);
    if (gap < 4) userLeft = false;
    if (stickBottom) hasNew = false;
    update();
  }, { passive: true });
  c.addEventListener('touchstart', () => { touchingMessages = true; userLeft = true; }, { passive: true });
  const release = () => { touchingMessages = false; };
  c.addEventListener('touchend', release, { passive: true });
  c.addEventListener('touchcancel', release, { passive: true });
  c.addEventListener('wheel', e => { if (e.deltaY < 0) { userLeft = true; stickBottom = false; } }, { passive: true });
  new ResizeObserver(() => { document.getElementById('chat-panel').style.setProperty('--input-h', input.offsetHeight + 'px'); update(); }).observe(input);
  btn.onclick = () => { scrollMessages(true); hasNew = false; update(); };
})();

function scrollMessages(force) {
  if (force) { stickBottom = true; userLeft = false; }
  if (!stickBottom || (touchingMessages && !force)) { notifyNewOutput(); return; }
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

// 串流回合的渲染器：管理交錯的「思考段／文字段／工具區塊」，文字段邊串邊轉 Markdown
function createTurn() {
  document.getElementById('empty-state')?.remove();
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `<div class="bubble"></div>`;
  container.appendChild(div);
  let bubble = div.querySelector('.bubble');
  let continued = false;

  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);
  // 狀態列一直排在游標後面；insert() 插在游標前，所以內容長出來它也還在最底下
  const status = document.createElement('div');
  status.className = 'turn-status';
  status.innerHTML = `<span class="ts-glyph">✻</span><span class="ts-label">啟動中…</span><span class="ts-time">0s</span>`;
  bubble.appendChild(status);
  const statusLabel = status.querySelector('.ts-label');
  const statusTime = status.querySelector('.ts-time');

  const started = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - started) / 1000);
    statusTime.textContent = s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
  };
  const timer = setInterval(tick, 1000);

  let textEl = null;        // 目前累積中的文字段
  let thinkEl = null;       // 目前累積中的思考段
  let mdTimer = null;       // 邊串邊轉 Markdown 的節流器
  const tools = new Map();  // tool_use_id -> { wrap, chip, out, nest, name }
  // 開了 --include-partial-messages 之後，同一段內容會來兩次：先逐字 delta，
  // 收尾再一發完整的 assistant 事件。記下已經串過的 `${message.id}:${index}` 才不會貼兩份。
  const streamed = new Set();
  const blockKind = new Map(); // stream index -> 'text' | 'thinking' | 'tool_use'
  const hidden = new Set();    // 不畫工具行的工具（見 HIDDEN_TOOLS）
  let msgId = '';

  function setStatus(label) { if (status.isConnected) statusLabel.textContent = label; }
  function stopStatus() { clearInterval(timer); status.remove(); }
  // 游標收掉之後（error/finish）還可能補字，這時就接在最後
  function insert(el) { cursor.parentNode === bubble ? bubble.insertBefore(el, cursor) : bubble.appendChild(el); }

  function paintText() {
    if (mdTimer) { clearTimeout(mdTimer); mdTimer = null; }
    if (!textEl) return;
    bubble.classList.add('md');
    textEl.innerHTML = renderMarkdown(textEl.dataset.raw);
  }

  function appendText(token) {
    setStatus('回覆中…');
    closeThinking();
    if (!textEl) {
      textEl = document.createElement('span');
      textEl.dataset.raw = '';
      insert(textEl);
    }
    textEl.dataset.raw += token;
    // 節流：每則 delta 都重排版太浪費，60ms 一次已經看不出延遲
    if (!mdTimer) mdTimer = setTimeout(() => { mdTimer = null; paintText(); }, 60);
  }

  function flushText() {
    if (!textEl) return;
    paintText();
    textEl = null;
  }

  // 思考段：灰字斜體，預設只露三行，點標題展開
  function appendThinking(token) {
    if (!token) return;
    setStatus('思考中…');
    flushText();
    if (!thinkEl) {
      const wrap = document.createElement('div');
      wrap.className = 'think-block';
      wrap.innerHTML = `<div class="tb-head">✻ Thinking…</div><div class="tb-body"></div>`;
      wrap.querySelector('.tb-head').onclick = () => wrap.classList.toggle('open');
      insert(wrap);
      thinkEl = wrap.querySelector('.tb-body');
    }
    thinkEl.textContent += token;
  }

  function closeThinking() {
    if (!thinkEl) return;
    const head = thinkEl.parentElement.querySelector('.tb-head');
    if (head) head.textContent = '✻ Thinking';
    thinkEl = null;
  }

  // 工具區塊：content_block_start 先立牌子（只有名字），assistant 事件到了再補參數與細節
  function appendTool(block) {
    // 反問類工具的 UI 就是底下那張提問卡，再畫一行「AskUserQuestion()」只是雜訊
    if (HIDDEN_TOOLS.has(block.name)) { hidden.add(block.id); return; }
    if (block.name) setStatus(`執行 ${block.name}…`);
    flushText();
    closeThinking();
    let t = tools.get(block.id);
    if (!t) {
      const wrap = document.createElement('div');
      wrap.className = 'tool-block running';
      wrap.innerHTML = `<div class="tool-chip"><span class="tc-dot">●</span><span class="tc-name"></span><span class="tc-arg"></span></div>`;
      insert(wrap);
      t = { wrap, chip: wrap.querySelector('.tool-chip'), out: null, nest: null, name: block.name };
      tools.set(block.id, t);
    }
    t.name = block.name || t.name;
    t.chip.querySelector('.tc-name').textContent = t.name || '';
    const arg = toolSummary(block);
    t.chip.querySelector('.tc-arg').textContent = arg ? `(${arg})` : '';
    // Edit 的 diff、TodoWrite 的清單：參數本身就是內容，值得直接畫出來
    const detail = toolDetail(block);
    if (detail) {
      t.wrap.querySelector('.tool-detail')?.remove();
      t.wrap.insertBefore(detail, t.out || null);
    }
  }

  // 子 agent（Task）跑的工具：縮排掛在母 Task 底下，不要灌進主流程
  function appendNested(parentId, block) {
    const t = tools.get(parentId);
    if (!t) return;
    if (!t.nest) {
      t.nest = document.createElement('div');
      t.nest.className = 'tool-nest';
      t.wrap.appendChild(t.nest);
    }
    const row = document.createElement('div');
    row.className = 'tn-row';
    const arg = toolSummary(block);
    row.textContent = `${block.name}${arg ? `(${arg})` : ''}`;
    t.nest.appendChild(row);
  }

  // 工具結果掛回對應的區塊底下，太長就折起來
  function appendToolResult(res) {
    if (hidden.has(res.tool_use_id)) return;   // 卡片上已經有「你選了什麼」，不必再重複一次
    const t = tools.get(res.tool_use_id);
    if (!t) return;
    setStatus('思考中…');   // 結果交回模型，等它決定下一步
    t.wrap.classList.remove('running');
    t.wrap.classList.add(res.is_error ? 'err' : 'ok');
    if (t.out) t.out.remove();
    t.out = null;

    const imgs = toolResultImages(res);
    const text = toolResultText(res);
    // 純圖片的結果（Read 一張 png）不必再秀「讀了 1 行」
    const view = imgs.length && !text.trim() ? { head: '', full: '', label: '' }
                                             : toolResultView(t.name, text, res.is_error);
    if (!view) return;                       // TodoWrite 這種只是回個 ack，不必顯示
    const { head, full, label } = view;

    const out = document.createElement('div');
    out.className = 'tool-out' + (res.is_error ? ' err' : '');
    const body = document.createElement('div');
    body.className = 'to-body';
    body.textContent = head;
    if (head) out.appendChild(body);

    if (imgs.length) {
      const box = document.createElement('div');
      box.className = 'to-imgs';
      for (const src of imgs) {
        const img = document.createElement('img');
        img.src = src;
        img.title = '點一下放大／縮小';
        img.onclick = () => img.classList.toggle('big');
        box.appendChild(img);
      }
      out.appendChild(box);
    }

    if (label) {
      const more = document.createElement('div');
      more.className = 'to-more';
      more.textContent = label;
      let open = false;
      more.onclick = () => {
        open = !open;
        body.textContent = open ? full : head;
        more.textContent = open ? '收合' : label;
      };
      out.appendChild(more);
    }
    t.out = out;
    t.wrap.appendChild(out);
  }

  // --include-partial-messages 的逐字事件
  function streamEvent(ev) {
    if (!ev) return;
    if (ev.type === 'message_start') { msgId = ev.message?.id || ''; blockKind.clear(); return; }
    if (ev.type === 'content_block_start') {
      const kind = ev.content_block?.type;
      blockKind.set(ev.index, kind);
      if (kind === 'text') closeThinking();
      else if (kind === 'thinking') flushText();
      else if (kind === 'tool_use') appendTool(ev.content_block);
      return;
    }
    if (ev.type === 'content_block_delta') {
      const d = ev.delta || {};
      if (d.type === 'text_delta') { streamed.add(msgId + ':' + ev.index); appendText(d.text || ''); }
      else if (d.type === 'thinking_delta') { streamed.add(msgId + ':' + ev.index); appendThinking(d.thinking || ''); }
      return;
    }
    if (ev.type === 'content_block_stop') {
      const kind = blockKind.get(ev.index);
      if (kind === 'text') flushText();
      else if (kind === 'thinking') closeThinking();
    }
  }

  const isStreamed = (id, index) => streamed.has((id || '') + ':' + index);

  const isEmpty = b => !b.textContent.trim() && !b.querySelector('.tool-block, .ask-card, .think-block');

  // 回合中使用者又補了一句（那句已經插在最底下）：之後的輸出改畫到它下面的新泡泡，
  // 讀起來才是「我說 → AI 接著做」的順序。已經開始的工具行留在原處，結果回來照樣掛回去
  function continueBelow() {
    flushText();
    closeThinking();
    const d = document.createElement('div');
    d.className = 'msg assistant';
    d.innerHTML = `<div class="bubble"></div>`;
    container.appendChild(d);
    const nb = d.querySelector('.bubble');
    nb.appendChild(cursor);
    if (status.isConnected) nb.appendChild(status);
    if (isEmpty(bubble)) bubble.parentElement.remove();
    bubble = nb;
    continued = true;
  }

  function finish() {
    stopStatus();
    flushText();
    closeThinking();
    cursor.remove();
    for (const t of tools.values()) t.wrap.classList.remove('running');
    if (isEmpty(bubble)) {
      // 補話後這一輪就沒再輸出了：多出來的空泡泡直接拿掉，不要留一個「無輸出」
      if (continued) bubble.parentElement.remove();
      else bubble.textContent = '（無輸出）';
    }
  }

  function error(msg) {
    stopStatus();
    cursor.remove();
    appendText('');
    textEl.dataset.raw = msg;
    paintText();
    textEl = null;
  }


  // Claude 停下來要人拍板時插一張卡；答完就鎖起來，避免重複送出
  const askCards = new Map(); // requestId -> el

  function appendAsk(ask, onAnswer) {
    if (askCards.has(ask.requestId)) return;
    setStatus('等你回答…');
    flushText();
    closeThinking();
    const card = buildAskCard(ask, onAnswer);
    askCards.set(ask.requestId, card);
    insert(card);
  }

  function resolveAsk(requestId, verdict) {
    const card = askCards.get(requestId);
    if (!card || card.classList.contains('resolved')) return;
    card.classList.add('resolved');
    const v = document.createElement('div');
    v.className = 'ask-verdict';
    v.textContent = verdict;
    card.appendChild(v);
  }

  return { appendText, appendThinking, appendTool, appendNested, appendToolResult, streamEvent,
           isStreamed, appendAsk, resolveAsk, finish, error, continueBelow,
           get bubble() { return bubble; } };
}

// 這些工具不畫工具行：它們的 UI 是 buildAskCard 那張卡
const HIDDEN_TOOLS = new Set(['AskUserQuestion']);

// tool_result 的 content 可能是字串，也可能是 block 陣列（Read 之類會回 text block）
function toolResultText(res) {
  const c = res.content;
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) {
    // 圖片另外由 toolResultImages 畫出來，這裡只收文字
    return c.map(b => b?.type === 'text' ? b.text : '')
            .filter(Boolean).join('\n');
  }
  if (typeof res.tool_use_result === 'string') return res.tool_use_result;
  return c == null ? '' : JSON.stringify(c);
}

// Read 圖檔、MCP 截圖會把 base64 圖片夾在 tool_result 裡，人在遠端全靠這個看畫面
function toolResultImages(res) {
  const c = res.content;
  if (!Array.isArray(c)) return [];
  return c.filter(b => b?.type === 'image' && b.source?.type === 'base64' && b.source.data)
          .map(b => `data:${b.source.media_type || 'image/png'};base64,${b.source.data}`);
}

// 晶片上那行參數：每個工具該秀什麼不一樣，照 CC 的 Bash(cmd) / Read(file) 取最有用的一項
function toolSummary(block) {
  const i = block.input || {};
  const short = p => {
    const s = String(p || '');
    const parts = s.split('/');
    return parts.length > 3 ? '.../' + parts.slice(-2).join('/') : s;
  };
  const oneLine = s => String(s || '').replace(/\s+/g, ' ').trim();
  let arg;
  switch (block.name) {
    case 'Bash':      arg = oneLine(i.command); break;
    case 'Read': case 'Write': case 'Edit': case 'NotebookEdit':
                      arg = short(i.file_path || i.notebook_path); break;
    case 'Glob': case 'Grep':
                      arg = (i.pattern || '') + (i.path ? ` in ${short(i.path)}` : ''); break;
    case 'WebFetch':  arg = i.url || ''; break;
    case 'WebSearch': arg = i.query || ''; break;
    case 'Task':      arg = oneLine(i.description || i.subagent_type); break;
    case 'Skill':     arg = i.skill || ''; break;
    case 'TodoWrite': arg = `${(i.todos || []).length} 項`; break;
    default:          arg = oneLine(i.description || i.command || i.file_path || i.pattern || i.url || '');
  }
  arg = String(arg ?? '');
  return arg.length > 120 ? arg.slice(0, 120) + '…' : arg;
}

// 參數本身就是內容的工具：Edit 出 diff、Write 出新檔預覽、TodoWrite 出勾選清單
function toolDetail(block) {
  const i = block.input || {};
  const el = document.createElement('div');
  el.className = 'tool-detail';

  if (block.name === 'TodoWrite' && Array.isArray(i.todos)) {
    el.classList.add('todos');
    for (const t of i.todos) {
      const row = document.createElement('div');
      row.className = 'td-row ' + (t.status || 'pending');
      const mark = t.status === 'completed' ? '☑' : t.status === 'in_progress' ? '▸' : '☐';
      const label = t.status === 'in_progress' ? (t.activeForm || t.content) : t.content;
      row.textContent = `${mark} ${label}`;
      el.appendChild(row);
    }
    return el.childElementCount ? el : null;
  }

  if (block.name === 'Edit' && typeof i.new_string === 'string') {
    el.classList.add('diff');
    appendDiffLines(el, String(i.old_string || '').split('\n'), '-');
    appendDiffLines(el, String(i.new_string).split('\n'), '+');
    return el.childElementCount ? el : null;
  }

  if (block.name === 'Write' && typeof i.content === 'string') {
    el.classList.add('diff');
    appendDiffLines(el, i.content.split('\n'), '+');
    return el.childElementCount ? el : null;
  }

  return null;
}

// diff 只露前 12 行，多的收成一行提示（完整內容在檔案裡，不必在聊天視窗重看一次）
function appendDiffLines(el, lines, sign) {
  const MAX = 12;
  if (lines.length === 1 && lines[0] === '') return;
  for (const line of lines.slice(0, MAX)) {
    const row = document.createElement('div');
    row.className = sign === '+' ? 'dl add' : 'dl del';
    row.textContent = sign + ' ' + line;
    el.appendChild(row);
  }
  if (lines.length > MAX) {
    const row = document.createElement('div');
    row.className = 'dl more';
    row.textContent = `  ... +${lines.length - MAX} 行`;
    el.appendChild(row);
  }
}

// 工具結果怎麼顯示：Read 只報行數（內容在編輯器裡看就好），其它照 OUT_LINES 折行
function toolResultView(name, text, isError) {
  const OUT_LINES = 8;
  if (!isError && name === 'TodoWrite') return null;      // 只是個 ack
  const lines = text.split('\n');

  if (!isError && (name === 'Read' || name === 'NotebookEdit')) {
    return { head: `讀了 ${lines.length} 行`, full: text, label: '展開' };
  }
  if (!isError && (name === 'Edit' || name === 'Write')) {
    return { head: lines[0] || '已更新', full: text, label: lines.length > 1 ? '展開' : '' };
  }
  if (!text.trim()) return { head: '（無輸出）', full: '', label: '' };

  const head = lines.slice(0, OUT_LINES).join('\n');
  return { head, full: text, label: lines.length > OUT_LINES ? `... +${lines.length - OUT_LINES} 行` : '' };
}

// ── 輕量 Markdown ────────────────────────────────────────────────────────────
// 逐行做區塊（code fence／標題／清單／引言／表格／分隔線），再跑行內樣式。
// 串流中途呼叫也安全：還沒收尾的 ``` 會當成「到目前為止」的 code block。

function mdEsc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// 行內樣式。先把 `code`、連結、裸網址抽走換成佔位符，免得裡面的 * _ ~ 被當成語法（網址常有 _）
// 佔位符用私有區字元，正文不可能撞到（拿數字當標記會把「共 3 個」這種句子吃掉）
const MD_HOLE = '\uE000';
// 只收 ASCII 的網址字元：中文與全形標點、** 粗體記號都不會被吞進去（非 ASCII 路徑通常已 %-編碼）
const MD_URL = /https?:\/\/[A-Za-z0-9\-._~:/?#[\]@!$&()+,;=%]+/g;
const MD_URL_FULL = /^https?:\/\/[A-Za-z0-9\-._~:/?#[\]@!$&()+,;=%]+$/;

function mdAttr(s) { return mdEsc(s).replace(/"/g, '&quot;'); }
function mdLink(href, html) { return `<a href="${mdAttr(href)}" target="_blank" rel="noopener">${html}</a>`; }

// 裸網址的結尾常黏著標點（中文句號、括號），切掉；右括號只在不成對時才切，保留 wiki/Foo_(bar) 這種
function mdSplitUrl(u) {
  let tail = '';
  while (u.length > 8) {
    const c = u[u.length - 1];
    if (!/[.,;:!?'"\]}>、。，；：！？）」』】〉》]/.test(c) && c !== ')') break;
    if (c === ')' && (u.match(/\(/g) || []).length >= (u.match(/\)/g) || []).length) break;
    tail = c + tail;
    u = u.slice(0, -1);
  }
  return [u, tail];
}

function mdEmph(t) {
  return t
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w*])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/(^|[^\w_])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
}

function mdInline(s) {
  const holes = [];
  const hole = html => { holes.push(html); return MD_HOLE + (holes.length - 1) + MD_HOLE; };
  let t = String(s)
    // 整段就是網址的 `code` 也能點
    .replace(/`([^`\n]+)`/g, (_, c) => hole(MD_URL_FULL.test(c) ? mdLink(c, `<code>${mdEsc(c)}</code>`) : `<code>${mdEsc(c)}</code>`))
    .replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, (m, txt, href) =>
      /^(https?:\/\/|\/|#)/.test(href) ? hole(mdLink(href, mdEmph(mdEsc(txt)))) : m)
    .replace(MD_URL, u => { const [url, tail] = mdSplitUrl(u); return hole(mdLink(url, mdEsc(url))) + tail; });
  t = mdEmph(mdEsc(t));
  // 連結文字裡可能還包著 code 的佔位符，填到沒有為止
  const fill = /\uE000(\d+)\uE000/g;
  while (fill.test(t)) t = t.replace(fill, (_, i) => holes[+i]);
  return t;
}

// 純文字（使用者訊息）：只把網址變連結，其餘照原樣跳脫
function linkifyText(s) {
  let out = '', last = 0;
  for (const m of String(s).matchAll(MD_URL)) {
    const [url] = mdSplitUrl(m[0]);
    out += mdEsc(s.slice(last, m.index)) + mdLink(url, mdEsc(url));
    last = m.index + url.length;
  }
  return out + mdEsc(String(s).slice(last));
}

const MD_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

// 清單：同層收在一起，縮排更深的丟給遞迴，順便支援 - [ ] 勾選框
function mdList(lines) {
  const items = [];
  let base = null, ordered = false, cur = null;
  for (const raw of lines) {
    const m = raw.match(MD_ITEM);
    if (m && (base === null || m[1].length <= base)) {
      if (base === null) { base = m[1].length; ordered = /\d/.test(m[2]); }
      cur = { text: m[3], children: [] };
      items.push(cur);
    } else if (cur) {
      cur.children.push(raw);
    }
  }
  if (!items.length) return `<p>${mdInline(lines.join('\n'))}</p>`;
  const li = it => {
    const task = it.text.match(/^\[([ xX])\]\s+(.*)$/);
    const body = task
      ? `<span class="md-task">${task[1] === ' ' ? '☐' : '☑'}</span>${mdInline(task[2])}`
      : mdInline(it.text);
    let sub = '';
    if (it.children.length) {
      sub = it.children.some(l => MD_ITEM.test(l))
        ? mdList(it.children)
        : `<br>${mdInline(it.children.map(l => l.trim()).join('\n'))}`;
    }
    return `<li>${body}${sub}</li>`;
  };
  return ordered ? `<ol>${items.map(li).join('')}</ol>` : `<ul>${items.map(li).join('')}</ul>`;
}

function renderMarkdown(src) {
  const lines = String(src).split('\n');
  const out = [];
  const para = [];
  const flushPara = () => {
    if (!para.length) return;
    out.push(`<p>${mdInline(para.join('\n'))}</p>`);
    para.length = 0;
  };
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    const fence = line.match(/^\s*```(\S*)\s*$/);
    if (fence) {
      flushPara();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
      i++;                                    // 收掉結尾的 ```（串流中途可能還沒來）
      out.push(`<pre><code${fence[1] ? ` class="lang-${fence[1]}"` : ''}>${mdEsc(body.join('\n'))}</code></pre>`);
      continue;
    }

    // 表格：這行有 |，下一行是 |---|---| 的分隔列
    const sep = lines[i + 1] || '';
    if (line.includes('|') && sep.includes('|') && sep.includes('-') && /^[\s|:-]+$/.test(sep)) {
      flushPara();
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => mdInline(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<div class="md-table"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead>` +
               `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushPara(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); i++; continue; }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); out.push('<hr>'); i++; continue; }

    if (/^\s*>\s?/.test(line)) {
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${renderMarkdown(buf.join('\n'))}</blockquote>`);
      continue;
    }

    if (MD_ITEM.test(line)) {
      flushPara();
      const buf = [];
      while (i < lines.length && (MD_ITEM.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && buf.length))) buf.push(lines[i++]);
      out.push(mdList(buf));
      continue;
    }

    if (!line.trim()) { flushPara(); i++; continue; }
    para.push(line);
    i++;
  }
  flushPara();
  return out.join('');
}

// ── Claude 的提問卡 ──────────────────────────────────────────────────────────
//
// 兩種形態共用同一條 control protocol，但 UI 完全不同：
//   requiresUserInteraction=false → 「准不准跑這個指令」，允許／總是允許／拒絕
//   requiresUserInteraction=true  → AskUserQuestion，要你在選項裡挑（答案回填 input.answers）

function askPreview(ask) {
  const i = ask.input || {};
  if (typeof i.command === 'string') return i.command;
  if (typeof i.file_path === 'string') return i.file_path;
  const j = JSON.stringify(i, null, 2);
  return j.length > 800 ? j.slice(0, 800) + '\n…' : j;
}

function buildAskCard(ask, onAnswer) {
  const card = document.createElement('div');
  card.className = 'ask-card';
  const isQuestion = ask.requiresUserInteraction && Array.isArray(ask.input?.questions);

  const head = document.createElement('div');
  head.className = 'ask-head';
  head.textContent = isQuestion ? '❓ Claude 想問你' : `🔐 需要授權 · ${ask.displayName || ask.toolName}`;
  card.appendChild(head);

  // 答完就鎖住，防止連點兩次送出兩份答案（第二份會被伺服器擋掉，但畫面會怪）
  let answered = false;
  const answer = (payload, verdict) => {
    if (answered) return;
    answered = true;
    card.classList.add('resolved');
    const v = document.createElement('div');
    v.className = 'ask-verdict';
    v.textContent = verdict;
    card.appendChild(v);
    onAnswer(payload);
  };

  if (isQuestion) {
    buildQuestionBody(card, ask, answer);
  } else {
    buildPermissionBody(card, ask, answer);
  }
  return card;
}

function buildPermissionBody(card, ask, answer) {
  if (ask.reason) {
    const r = document.createElement('div');
    r.className = 'ask-reason';
    r.textContent = ask.reason;
    card.appendChild(r);
  }
  const pre = document.createElement('div');
  pre.className = 'ask-cmd';
  pre.textContent = askPreview(ask);
  card.appendChild(pre);

  const actions = document.createElement('div');
  actions.className = 'ask-actions';

  const allow = document.createElement('button');
  allow.className = 'ask-btn primary';
  allow.textContent = '允許一次';
  allow.onclick = () => answer({ behavior: 'allow' }, '✓ 已允許');
  actions.appendChild(allow);

  // 「總是允許」用 claude 自己給的 permission_suggestions，範圍由它決定，我們不自己編規則
  if (ask.suggestions?.length) {
    const always = document.createElement('button');
    always.className = 'ask-btn';
    always.textContent = '總是允許';
    always.title = ask.suggestions
      .flatMap(sg => (sg.rules || []).map(r => `${r.toolName}(${r.ruleContent})`))
      .join('\n');
    always.onclick = () => answer({
      behavior: 'allow',
      // destination 用 localSettings：寫進該專案的 .claude/settings.local.json，之後開新對話也不再問
      updatedPermissions: ask.suggestions.map(sg => ({ ...sg, destination: 'localSettings' })),
    }, '✓ 已允許（已記住，之後不再問）');
    actions.appendChild(always);
  }

  const deny = document.createElement('button');
  deny.className = 'ask-btn danger';
  deny.textContent = '拒絕';
  deny.onclick = () => answer({ behavior: 'deny', message: 'User denied this request.' }, '✕ 已拒絕');
  actions.appendChild(deny);

  card.appendChild(actions);
}

function buildQuestionBody(card, ask, answer) {
  const questions = ask.input.questions;
  const picks = questions.map(() => new Set());
  const others = [];

  questions.forEach((q, qi) => {
    const title = document.createElement('div');
    title.className = 'ask-q';
    title.textContent = q.question + (q.multiSelect ? '（可複選）' : '');
    card.appendChild(title);

    const opts = [...(q.options || [])];
    opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'ask-opt';
      b.innerHTML = '<span class="ao-label"></span><span class="ao-desc"></span>';
      b.querySelector('.ao-label').textContent = o.label;
      b.querySelector('.ao-desc').textContent = o.description || '';
      b.onclick = () => {
        if (q.multiSelect) {
          picks[qi].has(o.label) ? picks[qi].delete(o.label) : picks[qi].add(o.label);
          b.classList.toggle('picked');
        } else {
          picks[qi].clear(); picks[qi].add(o.label);
          card.querySelectorAll(`[data-q="${qi}"]`).forEach(x => x.classList.remove('picked'));
          b.classList.add('picked');
        }
      };
      b.dataset.q = String(qi);
      card.appendChild(b);
    });

    // 選項都不對時的逃生口（對應原生 UI 的 "Other"）
    const other = document.createElement('input');
    other.className = 'ask-other';
    other.placeholder = '都不是 — 自己輸入…';
    others.push(other);
    card.appendChild(other);
  });

  const actions = document.createElement('div');
  actions.className = 'ask-actions';

  const submit = document.createElement('button');
  submit.className = 'ask-btn primary';
  submit.textContent = '送出';
  submit.onclick = () => {
    const answers = {};
    questions.forEach((q, qi) => {
      const typed = others[qi].value.trim();
      // 多選就用逗號串起來；claude 收到的是自然語言，這樣讀得懂
      const chosen = [...picks[qi]].join('、');
      const val = typed || chosen;
      if (val) answers[q.question] = val;
    });
    if (!Object.keys(answers).length) { others[0]?.focus(); return; }
    answer(
      // 答案是回填進 updatedInput.answers，key 用問題原文
      { behavior: 'allow', updatedInput: { ...ask.input, answers } },
      '✓ ' + Object.values(answers).join(' / ')
    );
  };
  actions.appendChild(submit);

  const skip = document.createElement('button');
  skip.className = 'ask-btn';
  skip.textContent = '略過';
  skip.onclick = () => answer({ behavior: 'deny', message: 'User dismissed the question.' }, '— 已略過');
  actions.appendChild(skip);

  card.appendChild(actions);
}

let lastPrompt = '';

let currentRunId = null;
// 伺服器的事件帶號碼（SSE 的 id:），記著最後一個，重連時用 ?from= 要回來，重疊的略過。
// 舊版伺服器沒有號碼，這裡就一直是空的，行為跟以前一樣
const lastSeq = { runId: null, seq: 0 };
function fromQuery(runId) {
  return lastSeq.runId && (!runId || lastSeq.runId === runId) && lastSeq.seq
    ? `?run=${encodeURIComponent(lastSeq.runId)}&from=${lastSeq.seq}` : '';
}

async function respondToAsk(runId, requestId, payload) {
  try {
    const r = await fetch(`/api/claude/${runId}/respond`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-access-token': TOKEN },
      body: JSON.stringify({ requestId, ...payload }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      appendSysMsg('⚠ 回覆失敗：' + (e.error || `HTTP ${r.status}`));
    }
  } catch (e) {
    appendSysMsg('⚠ 回覆失敗：' + e.message);
  }
}

// 讀完一條 SSE 串流。回 'done' = 伺服器正常收尾，'dropped' = 連線斷了但對話可能還活著
// turnArg 可以是現成的 turn，或是一個產生 turn 的函式——/watch 掛著聽時，
// 真的有內容來了才開泡泡，免得每次掛上去都留一個空的
async function pumpStream(res, turnArg) {
  let turn = typeof turnArg === 'function' ? null : turnArg;
  const T = () => turn || (turn = turnArg());
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let sawDone = false;
  // 登記起來給看門狗／切回前景用：cancel() 讓卡住的 read() 直接結束，走 'dropped' 去重連
  const pump = { lastRx: Date.now(), kick: () => reader.cancel().catch(() => {}) };
  livePumps.add(pump);
  let pumpRun = null, lineId = null;

  const processLine = (line) => {
    if (line.startsWith(':')) return;                          // 心跳
    if (line.startsWith('id: ')) { lineId = +line.slice(4); return; }
    if (!line.startsWith('data: ')) return;
    const id = lineId; lineId = null;
    if (line.trim() === 'data: [DONE]') { sawDone = true; return; }
    if (id != null && pumpRun) {
      if (lastSeq.runId === pumpRun && id <= lastSeq.seq) return;   // 補送跟已經畫過的重疊
      lastSeq.runId = pumpRun; lastSeq.seq = id;
    }
    try {
      const data = JSON.parse(line.slice(6));
      if (data.type === 'run') { currentRunId = pumpRun = data.runId; return; }
      if (data.type === 'state') { setBgTasks(data.bgTasks); resumingTurn = !!data.turnActive; return; }
      if (data.type === 'system' && data.subtype === 'background_tasks_changed') { setBgTasks(data.tasks); return; }
      if (data.type === 'permission_request') {
        const runId = currentRunId;
        T().appendAsk(data, (payload) => respondToAsk(runId, data.requestId, payload));
        scrollMessages();
        return;
      }
      if (data.type === 'permission_resolved') {
        // 別台裝置／重連後補送的結果：把卡片鎖起來，畫面才不會停在還能點的狀態
        T().resolveAsk(data.requestId, data.behavior === 'allow' ? '✓ 已允許' : '✕ 已拒絕');
        return;
      }
      // 開了分支的新對話：claude 實際在 worktree 裡跑，執行目錄跟著換過去（檔案面板、下一句都在分支裡）
      if (data.type === 'system' && data.subtype === 'init' && typeof data.cwd === 'string' && data.cwd.includes('/.claude/worktrees/') && data.cwd !== cwd) {
        setCwd(data.cwd);
        setTimeout(updateBranchBadge, 300);
      }
      if (data.type === 'system' && data.session_id && data.session_id !== sessionId) {
        const isNew = !sessionId;
        sessionId = data.session_id;
        saveConv('cg_session', sessionId);
        updateSessionBadge();
        if (isNew) appendSysMsg('新對話 · ' + sessionId.slice(0, 8));
      }
      // 逐字 delta（--include-partial-messages）。子 agent 的不進主流程，免得洗版
      if (data.type === 'stream_event') {
        if (!data.parent_tool_use_id) T().streamEvent(data.event);
        return;
      }
      const parent = data.parent_tool_use_id;
      if (data.type === 'assistant' && data.message?.content) {
        const mid = data.message.id;
        data.message.content.forEach((b, i) => {
          // 子 agent 只秀它跑了哪些工具，講的話由 Task 的結果代表
          if (parent) { if (b.type === 'tool_use') T().appendNested(parent, b); return; }
          if (b.type === 'tool_use') T().appendTool(b);            // 補上完整參數
          else if (T().isStreamed(mid, i)) return;                 // 已經逐字串過了
          else if (b.type === 'text') T().appendText(b.text);
          else if (b.type === 'thinking') T().appendThinking(b.thinking || '');
        });
      } else if (data.type === 'user' && Array.isArray(data.message?.content) && !parent) {
        // 工具跑完的結果：掛回對應的工具行底下
        for (const b of data.message.content) {
          if (b.type === 'tool_result') T().appendToolResult(b);
        }
      } else if (data.type === 'text') {
        T().appendText(data.text);
      } else if (data.type === 'error') {
        T().appendText('\n⚠ ' + data.text);
      } else if (data.type === 'result') {
        const u = data.usage || {};
        const secs = data.duration_ms ? (data.duration_ms / 1000).toFixed(1) + 's' : '';
        const cost = data.total_cost_usd ? ' · $' + data.total_cost_usd.toFixed(4) : '';
        const inTok = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
        const toks = u.output_tokens ? ` · ${fmtTok(inTok)} in / ${fmtTok(u.output_tokens)} out` : '';
        if (secs || cost) appendSysMsg(`✓ 完成 · ${secs}${cost}${toks}`);
      }
    } catch {}
  };

  while (true) {
    let r;
    // iOS 切背景／鎖屏斷線時 read() 是丟錯（Load failed）而不是正常結束；
    // 當成斷線交給外層重連，不能落到「↻ 重試」——伺服器那輪還在跑，重試等於同一句再送一次
    try { r = await reader.read(); }
    catch (e) { if (e.name === 'AbortError') { livePumps.delete(pump); throw e; } break; }
    const { done, value } = r;
    if (done) break;
    pump.lastRx = Date.now();
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() ?? '';
    for (const line of lines) processLine(line);
    scrollMessages();
  }
  livePumps.delete(pump);
  if (buffer) processLine(buffer);
  return sawDone ? 'done' : 'dropped';
}

// ── 連線保活 ────────────────────────────────────────────────────────────────
// iOS 切背景後 SSE 常常是「半死」：不報錯也不結束，read() 永遠等不到東西。
// 伺服器每 15 秒送一次心跳，所以太久沒收到任何位元組就是死了，主動踢掉重連；
// 切回前景、換網路時不等看門狗，直接踢。
const livePumps = new Set();
const SILENT_DEAD_MS = 30000;      // 心跳 15 秒一次，30 秒沒動靜就當死了
const HIDDEN_STALE_MS = 10000;     // 在背景待超過這麼久，回來時舊連線當作已死
const RECONNECT_GIVEUP_MS = 10 * 60 * 1000;   // 在前景連續接不上這麼久才放棄
const backoff = n => Math.min(1000 * 2 ** (n - 1), 15000);
let hiddenAt = 0, lastWakeAt = 0;

// 可以被「切回前景」提早叫醒的等待：重連的退避不用傻等到時間到
let wakeWaiters = [];
function wakeSleep(ms) {
  return new Promise(resolve => {
    const done = () => { clearTimeout(t); wakeWaiters = wakeWaiters.filter(f => f !== done); resolve(); };
    const t = setTimeout(done, ms);
    wakeWaiters.push(done);
  });
}

setInterval(() => {
  for (const p of livePumps) if (Date.now() - p.lastRx > SILENT_DEAD_MS) p.kick();
}, 5000);

function reviveConnections(force) {
  lastWakeAt = Date.now();
  const stale = force || (hiddenAt && Date.now() - hiddenAt > HIDDEN_STALE_MS);
  hiddenAt = 0;
  if (stale) for (const p of livePumps) p.kick();
  wakeWaiters.slice().forEach(f => f());
  if (!streaming && !watchCtl) startWatch();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else reviveConnections(false);
});
window.addEventListener('pageshow', e => { if (e.persisted) reviveConnections(true); });   // 從 bfcache 回來
window.addEventListener('online', () => reviveConnections(true));                          // 換網路，舊連線一定死了

// 對照對話紀錄的最後一則回覆，畫面上沒有就補上
async function fillMissedReply(turn) {
  if (!sessionId) return;
  try {
    const r = await fetch('/api/session-history?sessionId=' + encodeURIComponent(sessionId), { headers: { 'x-access-token': TOKEN } });
    if (!r.ok) return;
    const { messages } = await r.json();
    const last = messages[messages.length - 1];
    if (!last || last.role !== 'assistant' || !last.text?.trim()) return;
    // 畫面上是渲染過的 markdown，比對前把符號和空白都拿掉
    const norm = t => t.replace(/[\s*_`#>|\-\[\]()~]/g, '');
    const probe = norm(last.text).slice(0, 40);
    if (norm(turn.bubble?.textContent || '').includes(probe)) return;
    appendSysMsg('補上斷線期間沒收到的回覆');
    appendMessage('assistant', last.text).innerHTML = renderMarkdown(last.text);
    scrollMessages();
  } catch {}
}

// 送給伺服器的只要類型和資料，預覽用的 object URL 留在前端
const imagesPayload = imgs => imgs.length ? imgs.map(({ media_type, data }) => ({ media_type, data })) : undefined;

// retry = { prompt, images }：重試或補送，畫面上已經有那則使用者訊息了，不再畫一次
async function sendMessage(retry) {
  const prompt = retry ? retry.prompt : promptInput.value.trim();
  const images = retry ? retry.images : attachments.slice();
  if (!prompt && !images.length) return;

  if (!retry) {
    closeCompletion();
    pushHistory(prompt);
    histIdx = -1;
    promptInput.value = '';
    autosize();
    localStorage.removeItem(DRAFT_KEY);
    attachments = [];
    renderAttachments();
    refreshSendBtn();
    // 跟 CC 一樣 /clear 就是重開一段對話；網頁上由前端直接處理
    if (prompt === '/clear' && !images.length) { if (streaming) abortStream(); newConversation(); return; }
    if (streaming) { sendMidTurn(prompt, images); return; }
    appendMessage('user', prompt, images);
  } else if (streaming) return;
  lastPrompt = prompt;

  stopWatch();
  setStreaming(true);
  const turn = activeTurn = createTurn();
  abortController = new AbortController();
  currentRunId = null;

  try {
    // 伺服器重啟的空檔：503 restarting 是新回合被明確擋下，502／504／530 是隧道接不到本機，
    // 兩者都保證伺服器沒收到這句，所以可以安全地等新版起來再自動送（不會重複執行）
    let res, waitMsg = null;
    for (let n = 1; ; n++) {
      res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-access-token': TOKEN },
        body: JSON.stringify({ prompt, images: imagesPayload(images), sessionId, cwd, ...driverOfChoice(chatModel.value), permMode: chatPerm.value, worktree: !sessionId && document.getElementById('chat-branch').checked }),
        signal: abortController.signal,
      });
      const restarting = [502, 504, 530].includes(res.status)
        || (res.status === 503 && (await res.clone().json().catch(() => ({}))).restarting);
      if (!restarting || n > 40) break;
      if (!waitMsg) waitMsg = appendSysMsg('伺服器更新中，起來後自動送出…');
      await wakeSleep(Math.min(backoff(n), 5000));
    }
    if (waitMsg && res.ok) waitMsg.textContent = '✓ 伺服器已更新，訊息已送出';
    if (res.ok) document.getElementById('chat-branch').checked = false;   // 分支是這一段的選擇，下一段新對話重新選
    if (res.status === 429) { const e = await res.json().catch(() => ({})); throw new Error(e.error || '伺服器忙碌中'); }
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || `HTTP ${res.status}`); }

    // 對話會停下來等人回答，這期間手機切走／鎖屏很容易把 SSE 弄斷。
    // 伺服器端進程還活著，拿同一個 runId 接回去就好，斷線期間的事件會補送。
    // 在前景就一直試（指數退避，最多 15 秒一次），只有 404 或前景連續十分鐘接不上才放棄
    let fails = 0, failSince = 0, gaveUp = false, reconnected = false, outcome = 'dropped', status = null;
    while (true) {
      if (res) outcome = await pumpStream(res, turn);
      if (outcome === 'done' || !currentRunId) break;
      if (!failSince) failSince = Date.now();
      if (document.visibilityState === 'visible' && Date.now() - Math.max(failSince, lastWakeAt) > RECONNECT_GIVEUP_MS) { gaveUp = true; break; }
      fails++;
      const msg = `連線中斷，重新接上…（第 ${fails} 次）`;
      if (status) status.textContent = msg; else status = appendSysMsg(msg);
      await wakeSleep(fails === 1 ? 300 : backoff(fails - 1));
      // 剛從背景切回來網路常常還沒好，fetch 直接丟錯；當成這次沒接上再試，
      // 不能讓它掉到外層的「↻ 重試」（那會把同一句再送一次）
      let again;
      try {
        again = await fetch(`/api/claude/${currentRunId}/stream${fromQuery(currentRunId)}`, {
          headers: { 'x-access-token': TOKEN },
          signal: abortController.signal,
        });
      } catch (e) { if (e.name === 'AbortError') throw e; res = null; continue; }
      if (again.status === 404) { turn.appendText('\n⚠ 這段對話的進程已結束，無法重新接上'); break; }
      if (!again.ok) { res = null; continue; }   // 409／5xx／隧道暫時不通：再試
      res = again;
      reconnected = true;
      status.textContent = '✓ 已重新接上';
      status = null; fails = 0; failSince = 0;
    }
    if (gaveUp) turn.appendText('\n⚠ 一直接不上，請稍後重新整理頁面');
    turn.finish();
    // 斷過線：最後那段回覆可能寫進了死連線沒收到，從對話紀錄補回來
    if (reconnected || outcome !== 'done') await fillMissedReply(turn);
  } catch (e) {
    if (e.name === 'AbortError') { turn.finish(); }
    else {
      turn.error(`連線中斷：${e.message}`);
      // 不靜默重試（Claude 會改檔/跑指令，重跑有副作用）— 提供一鍵重試，沿用 sessionId 保留上下文
      const btn = document.createElement('div');
      btn.className = 'retry-btn';
      btn.textContent = '↻ 重試';
      btn.onclick = () => { btn.remove(); sendMessage({ prompt, images }); };
      turn.bubble.appendChild(btn);
    }
  } finally {
    if (activeTurn !== turn) return;   // 已經脫鉤（開了新對話）：新對話的狀態不歸這輪管
    currentRunId = null;
    activeTurn = null;
    setStreaming(false);
    scrollMessages();
    // Claude 常會改檔，回合結束自動刷新檔案面板（軟刷新，不動使用者正在看的東西）
    if (filesVisible && currentPath) refreshDir(currentPath);
    if (sessionId && document.visibilityState === 'visible') markSeen(sessionId);   // 看著它做完的，不必再進收件箱
    if (!flushQueued()) startWatch();   // 回合結束進程還留著：背景任務做完的回報從這裡進來
  }
}

// 回合進行中再補一句：寫進同一個 claude 進程，它會在下一個工具邊界併進這一輪
// （實測只會回一個 result），所以不必開新串流，輸出照樣從原本那條進來
async function sendMidTurn(prompt, images) {
  const bubble = appendMessage('user', prompt, images);
  const tag = document.createElement('span');
  tag.className = 'queued-tag';
  bubble.appendChild(tag);
  activeTurn?.continueBelow();
  scrollMessages();
  const later = () => {
    tag.textContent = '⏳ 這輪結束後送出';
    queuedAfterTurn.push({ prompt, images });
    if (!streaming) flushQueued();
  };
  const runId = currentRunId;
  if (!runId) { later(); return; }            // 連 runId 都還沒拿到（進程剛起），等這輪結束
  tag.textContent = '⏳ 送出中…';
  try {
    const r = await fetch(`/api/claude/${runId}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-access-token': TOKEN },
      body: JSON.stringify({ prompt, images: imagesPayload(images) }),
    });
    if (r.status === 409 || r.status === 404) { later(); return; }   // 剛好這輪收尾了
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || `HTTP ${r.status}`); }
    tag.textContent = '↳ 已併入這一輪';
  } catch (e) {
    tag.textContent = '⚠ 沒送出：' + e.message;
  }
}

// 這輪結束時還有排著的話：併成一則正常送出。回傳有沒有送
function flushQueued() {
  if (streaming || !queuedAfterTurn.length) return false;
  const q = queuedAfterTurn;
  queuedAfterTurn = [];
  sendMessage({
    prompt: q.map(m => m.prompt).filter(Boolean).join('\n\n'),
    images: q.flatMap(m => m.images),
  });
  return true;
}

// ── 回合之間掛著聽 ─────────────────────────────────────────────────────────
// 伺服器在回合結束後保留 claude 進程，背景任務（背景指令、背景 agent）做完時
// claude 會自己開一輪回報。這裡掛一條 /watch 把那一輪接下來畫出來；
// 進程不在了（404）就停，使用者送新訊息前先撤掉（那一輪由 sendMessage 接手）。
let watchCtl = null;
let resumingTurn = false;   // 接上時伺服器說回合還在跑（頁面重開時剛好在回覆中）
function setBgTasks(tasks) {
  const el = document.getElementById('session-bg');
  const n = Array.isArray(tasks) ? tasks.length : 0;
  el.style.display = n ? '' : 'none';
  el.textContent = n ? `⏳ 背景 ${n}` : '';
  el.title = n ? tasks.map(t => t.description || t.task_id).join('\n') : '';
}
function stopWatch() { watchCtl?.abort(); watchCtl = null; }
async function startWatch() {
  if (watchCtl || streaming || !sessionId || !TOKEN) return;
  const ctl = watchCtl = new AbortController();
  const sid = sessionId;
  let busy = 0, fails = 0;
  try {
    while (!ctl.signal.aborted && !streaming && sessionId === sid) {
      let res;
      try {
        res = await fetch(`/api/claude/session/${encodeURIComponent(sid)}/watch${fromQuery()}`, {
          headers: { 'x-access-token': TOKEN }, signal: ctl.signal,
        });
      } catch (e) {
        // 剛切回來網路還沒好：退避再掛，不要整個收掉（以前要等下次送訊息才會再掛）
        if (e.name === 'AbortError') break;
        await wakeSleep(backoff(++fails));
        continue;
      }
      if (res.status >= 500) { await wakeSleep(backoff(++fails)); continue; }   // 隧道／伺服器重啟中
      if (res.status === 409 && ++busy <= 10) {
        // 可能是別的分頁在聽，也可能是剛才被 iOS 切掉的舊連線伺服器還沒發現（心跳寫失敗才會發現，約 15 秒）
        await new Promise(r => setTimeout(r, 3000));
        continue;
      }
      if (!res.ok) { if (res.status === 404) setBgTasks([]); break; }
      busy = 0; fails = 0;
      resumingTurn = false;
      let turn = null;
      const outcome = await pumpStream(res, () => {
        appendSysMsg(resumingTurn ? '接回進行中的回合' : '背景任務回報');
        return (turn = createTurn());
      });
      turn?.finish();
      scrollMessages();
      if (outcome === 'dropped') await new Promise(r => setTimeout(r, 2000));   // 斷線：稍等再掛
    }
  } catch { /* 被 stopWatch 撤掉，或網路斷了——下次送訊息後會再掛 */ }
  if (watchCtl === ctl) watchCtl = null;
}

function abortStream() {
  // 停在等回答的 session 斷線後會留著等重連，所以要明確告訴伺服器收掉，不能只 abort fetch
  if (currentRunId) {
    fetch(`/api/claude/${currentRunId}/abort`, {
      method: 'POST', headers: { 'x-access-token': TOKEN },
    }).catch(() => {});
  }
  abortController?.abort();
  setStreaming(false);
  // 還排著沒送的補充話跟 CC 一樣退回輸入框，讓人決定要不要再送
  if (queuedAfterTurn.length) {
    const back = queuedAfterTurn;
    queuedAfterTurn = [];
    setInput([...back.map(m => m.prompt), promptInput.value].filter(Boolean).join('\n\n'));
    attachments.push(...back.flatMap(m => m.images));
    renderAttachments(); refreshSendBtn();
  }
}

// 開新對話時上一段還在跑：畫面跟它脫鉤（不再收它的回應、不重連、不再往它插話），
// 但不殺掉它——它在伺服器上把事情做完，之後從清單點回去看得到。
// 沒脫鉤的話，下一句會被當成插話塞進舊那段，舊那段跑完還會把編號改回去（新對話又接回舊 session）
function detachTurn() {
  if (!streaming) return;
  currentRunId = null;        // 重連迴圈看到沒有 runId 就停
  activeTurn = null;          // 舊那輪收尾時認得出自己已經被脫鉤，不去動新對話的狀態
  abortController?.abort();
  setStreaming(false);
  if (queuedAfterTurn.length) {   // 原本要插進舊那段的話，退回輸入框
    const back = queuedAfterTurn;
    queuedAfterTurn = [];
    setInput([...back.map(m => m.prompt), promptInput.value].filter(Boolean).join('\n\n'));
    attachments.push(...back.flatMap(m => m.images));
    renderAttachments(); refreshSendBtn();
  }
}

function newConversation() {
  detachTurn();
  stopWatch();
  setBgTasks([]);
  sessionId = null;
  sessionStorage.removeItem('cg_session');
  localStorage.removeItem('cg_session');
  updateSessionBadge();
  stickBottom = true;
  const container = document.getElementById('messages');

// ── Files: helpers ────────────────────────────────────────────────────────────
function formatSize(bytes) {
  if (bytes == null) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 ** 2) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 ** 3) return (bytes / 1024 ** 2).toFixed(1) + ' MB';
  return (bytes / 1024 ** 3).toFixed(1) + ' GB';
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('zh-TW', {
    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
  });
}

function fileIcon(item) {
  if (item.isDir) return '📁';
  const ext = item.name.split('.').pop()?.toLowerCase() || '';
  const map = {
    js: '📜', ts: '📜', jsx: '📜', tsx: '📜', py: '🐍', rb: '💎', go: '🐹', rs: '⚙️',
    json: '📋', yaml: '📋', yml: '📋', toml: '📋', md: '📝', txt: '📝', log: '📝',
    html: '🌐', css: '🎨', png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', webp: '🖼', svg: '🖼',
    mp4: '🎬', webm: '🎬', mov: '🎬', mp3: '🎵', wav: '🎵', ogg: '🎵',
    pdf: '📕', zip: '📦', tar: '📦', gz: '📦', sh: '⚡', bash: '⚡', zsh: '⚡',
  };
  return map[ext] || '📄';
}

function apiUrl(path, extra = '') {
  return `${path}?token=${encodeURIComponent(TOKEN)}${extra}`;
}

// ── Files: directory ──────────────────────────────────────────────────────────
async function loadDir(path) {
  currentPath = path;
  selectedPaths.clear();
  previewFilePath = null;
  fileFilter = '';
  const searchBox = document.getElementById('files-search');
  if (searchBox) searchBox.value = '';
  updateSelectionUI();
  showPreviewEmpty();

  const tbody = document.getElementById('file-list-body');
  document.getElementById('file-list-empty').style.display = 'none';
  tbody.innerHTML = '<tr><td colspan="5" class="file-list-loading"><span class="spinner"></span>載入中…</td></tr>';

  try {
    const r = await fetch(apiUrl('/api/fs/ls', `&path=${encodeURIComponent(path)}`));
    const data = await r.json();
    if (data.error) { tbody.innerHTML = ''; alert(data.error); return; }
    currentItems = data.items;
    renderBreadcrumb(data.path, data.workRoot);
    renderFileList();
  } catch (e) {
    tbody.innerHTML = '';
    alert('載入失敗：' + e.message);
  }
}

// 回合結束的自動刷新。不能直接用 loadDir()：它會清掉選取、關掉正在看的預覽、清空搜尋框、
// 還閃一下「載入中…」並把列表捲回最上面 —— 對「使用者主動切目錄」是對的，對背景刷新是災難。
// 這裡只換列表內容，其餘狀態原封不動；內容沒變就完全不重繪。
async function refreshDir(path) {
  if (path !== currentPath) return;
  // 正在改名就別動，重繪會把人家打到一半的輸入框吃掉
  if (document.querySelector('#file-list-body .rename-input')) return;

  let data;
  try {
    const r = await fetch(apiUrl('/api/fs/ls', `&path=${encodeURIComponent(path)}`));
    data = await r.json();
  } catch { return; }                       // 背景刷新失敗就安靜略過，不要跳 alert 打斷人
  if (data.error || path !== currentPath) return;   // 期間使用者換了目錄就作廢

  if (JSON.stringify(data.items) === JSON.stringify(currentItems)) return; // 沒變就不動
  currentItems = data.items;

  const alive = new Set(currentItems.map(i => i.path));
  // 選取／預覽只在該檔案真的消失時才收掉
  let selChanged = false;
  for (const sp of [...selectedPaths]) if (!alive.has(sp)) { selectedPaths.delete(sp); selChanged = true; }
  if (selChanged) updateSelectionUI();
  if (previewFilePath && !alive.has(previewFilePath)) { previewFilePath = null; showPreviewEmpty(); }

  const scroll = document.getElementById('file-list-scroll');
  const top = scroll?.scrollTop ?? 0;
  renderFileList();
  if (scroll) scroll.scrollTop = top;
}

function applyFilter(v) { fileFilter = v.trim().toLowerCase(); renderFileList(); }

function setSort(key) {
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = 1; }
  renderFileList();
}

function updateSortArrows() {
  document.querySelectorAll('.sort-arrow').forEach(s => {
    s.textContent = s.dataset.sort === sortKey ? (sortDir > 0 ? '▲' : '▼') : '';
  });
}

function visibleItems() {
  return currentItems
    .filter(i => !fileFilter || i.name.toLowerCase().includes(fileFilter))
    .slice()
    .sort((a, b) => {
      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1; // 資料夾永遠在前
      let v;
      if (sortKey === 'size') v = (a.size || 0) - (b.size || 0);
      else if (sortKey === 'mtime') v = new Date(a.mtime || 0) - new Date(b.mtime || 0);
      else v = a.name.localeCompare(b.name);
      return v * sortDir;
    });
}

function renderBreadcrumb(path, root) {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  const home = document.createElement('span');
  home.className = 'bc-seg'; home.textContent = '~';
  home.onclick = () => loadDir(root);
  bc.appendChild(home);
  if (path === root) return;
  const rel = path.slice(root.length).split('/').filter(Boolean);
  let built = root;
  for (let i = 0; i < rel.length; i++) {
    built += '/' + rel[i];
    const sep = document.createElement('span');
    sep.className = 'bc-sep'; sep.textContent = '/';
    bc.appendChild(sep);
    const seg = document.createElement('span');
    if (i === rel.length - 1) {
      seg.className = 'bc-current'; seg.textContent = rel[i];
    } else {
      seg.className = 'bc-seg'; seg.textContent = rel[i];
      const builtCopy = built;
      seg.onclick = () => loadDir(builtCopy);
    }
    bc.appendChild(seg);
  }
}

function renderFileList() {
  const tbody = document.getElementById('file-list-body');
  const empty = document.getElementById('file-list-empty');
  const items = visibleItems();
  tbody.innerHTML = '';
  updateSortArrows();

  const atRoot = currentPath === workRoot;
  if (items.length === 0) {
    empty.style.display = 'block';
    empty.textContent = fileFilter ? '無符合項目' : '目錄為空';
  } else {
    empty.style.display = 'none';
  }

  // Back row（過濾時不顯示，避免混淆）
  if (!atRoot && !fileFilter) {
    const parentPath = currentPath.split('/').slice(0, -1).join('/') || '/';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td></td><td colspan="4"><div class="file-name-cell"><span class="file-icon">⬆️</span><span class="file-name" style="color:var(--text-sub)">..</span></div></td>`;
    tr.onclick = () => loadDir(parentPath);
    tbody.appendChild(tr);
  }

  for (const item of items) {
    const tr = document.createElement('tr');
    tr.dataset.path = item.path;

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = selectedPaths.has(item.path);
    cb.addEventListener('change', e => { e.stopPropagation(); toggleSelect(item.path, cb.checked); });

    const tdCb = document.createElement('td'); tdCb.appendChild(cb);

    const tdName = document.createElement('td');
    tdName.innerHTML = `<div class="file-name-cell"><span class="file-icon">${fileIcon(item)}</span><span class="file-name" title="${escHtml(item.name)}">${escHtml(item.name)}</span></div>`;

    const tdSize = document.createElement('td');
    tdSize.className = 'col-size'; tdSize.textContent = item.isDir ? '—' : formatSize(item.size);

    const tdDate = document.createElement('td');
    tdDate.className = 'col-mtime'; tdDate.textContent = formatDate(item.mtime);

    const tdAction = document.createElement('td'); tdAction.className = 'col-action';
    const renameBtn = document.createElement('button');
    renameBtn.className = 'row-btn'; renameBtn.title = '重新命名'; renameBtn.textContent = '✎';
    renameBtn.addEventListener('click', e => { e.stopPropagation(); startRename(tr, item); });
    tdAction.appendChild(renameBtn);
    if (item.isDir) {
      const btn = document.createElement('button');
      btn.className = 'row-btn'; btn.title = '壓縮下載'; btn.textContent = '📦';
      btn.addEventListener('click', e => { e.stopPropagation(); zipSingle(item); });
      tdAction.appendChild(btn);
    }

    tr.appendChild(tdCb); tr.appendChild(tdName); tr.appendChild(tdSize);
    tr.appendChild(tdDate); tr.appendChild(tdAction);

    tr.addEventListener('click', e => {
      if (e.target === cb || tr.querySelector('.rename-input')) return;
      if (item.isDir) loadDir(item.path);
      else { previewFile(item); tr.classList.toggle('selected'); }
    });

    if (selectedPaths.has(item.path)) tr.classList.add('selected');
    tbody.appendChild(tr);
  }
  document.getElementById('select-all').checked = false;
}

// 行內重新命名
function startRename(tr, item) {
  const nameSpan = tr.querySelector('.file-name');
  if (!nameSpan || tr.querySelector('.rename-input')) return;
  const cell = nameSpan.parentElement;
  const input = document.createElement('input');
  input.className = 'rename-input'; input.value = item.name;
  nameSpan.style.display = 'none';
  cell.appendChild(input);
  input.focus(); input.select();

  let finished = false;
  const cleanup = () => { input.remove(); nameSpan.style.display = ''; };
  const commit = async () => {
    if (finished) return; finished = true;
    const newName = input.value.trim();
    cleanup();
    if (!newName || newName === item.name) return;
    const r = await fetch('/api/fs/rename', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-access-token': TOKEN },
      body: JSON.stringify({ from: item.path, name: newName }),
    });
    const data = await r.json().catch(() => ({}));
    if (data.error) alert('重新命名失敗：' + data.error);
    loadDir(currentPath);
  };
  const cancel = () => { if (finished) return; finished = true; cleanup(); };

  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { cancel(); }
  });
  input.addEventListener('blur', commit);
}

async function newFolder() {
  const name = prompt('資料夾名稱：');
  if (name == null || !name.trim()) return;
  const r = await fetch('/api/fs/mkdir', {

    body: JSON.stringify({ path: currentPath, name: name.trim() }),
  });
  const data = await r.json().catch(() => ({}));
  if (data.error) alert('建立失敗：' + data.error);
  else loadDir(currentPath);
}

function showPreviewEmpty() {

async function previewFile(item) {
  previewFilePath = item.path;
  document.getElementById('preview-filename').textContent = item.name;
  document.getElementById('preview-empty-state').style.display = 'none';
  document.getElementById('preview-content').style.display = 'flex';
  document.getElementById('files-main').classList.add('previewing');
  const body = document.getElementById('preview-body');
  body.innerHTML = '<div class="preview-info"><span>載入中…</span></div>';

  const ext = item.name.split('.').pop()?.toLowerCase() || '';
  const encodedPath = encodeURIComponent(item.path);

  if (['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)) {
    body.innerHTML = `<img class="preview-image" src="${apiUrl('/api/fs/file', `&path=${encodedPath}`)}" alt="${escHtml(item.name)}">`;
    return;
  }
  if (['mp4','webm','mov'].includes(ext)) {
    body.innerHTML = `<video class="preview-media" controls src="${apiUrl('/api/fs/file', `&path=${encodedPath}`)}"></video>`;
    return;
  }
  if (['mp3','wav','ogg'].includes(ext)) {
    body.innerHTML = `<audio class="preview-media" controls src="${apiUrl('/api/fs/file', `&path=${encodedPath}`)}"></audio>`;
    return;
  }
  if (ext === 'pdf') {
    body.innerHTML = `<iframe class="preview-pdf" src="${apiUrl('/api/fs/file', `&path=${encodedPath}`)}"></iframe>`;
    return;
  }

  const r = await fetch(apiUrl('/api/fs/preview', `&path=${encodedPath}`));
  const data = await r.json();
  if (data.type === 'text') {
    previewTextContent = data.content;
    document.getElementById('btn-copy-preview').style.display = '';
    body.innerHTML = '';
    if (ext === 'md' || ext === 'markdown') {
      const div = document.createElement('div');
      div.className = 'bubble md preview-md';
      div.innerHTML = renderMarkdown(data.content);
      body.appendChild(div);
    } else {
      const pre = document.createElement('pre');
      pre.className = 'preview-text'; pre.textContent = data.content;
      body.appendChild(pre);
    }
  } else if (data.type === 'too-large') {
    body.innerHTML = `<div class="preview-info"><strong>檔案過大</strong><span>${formatSize(data.size)}</span><span>請直接下載查看</span></div>`;
  } else {
    body.innerHTML = `<div class="preview-info"><strong>二進位檔案</strong><span>${formatSize(item.size)}</span><span>請直接下載查看</span></div>`;
  }
}

async function doZip(paths, name) {
  const r = await fetch('/api/fs/zip', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-access-token': TOKEN },
    body: JSON.stringify({ paths, name }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); alert('ZIP 失敗：' + (e.error || r.status)); return; }
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name + '.zip'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

document.getElementById('upload-input').addEventListener('change', e => {
  if (e.target.files.length) { uploadFiles(e.target.files); e.target.value = ''; }
});

function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);

  const bar = document.getElementById('upload-bar');
  const fill = document.getElementById('upload-fill');
  bar.classList.add('active'); fill.style.width = '0';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', apiUrl('/api/fs/upload', `&path=${encodeURIComponent(currentPath)}`));
  xhr.setRequestHeader('x-access-token', TOKEN);
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%';
  };
  const done = () => { bar.classList.remove('active'); fill.style.width = '0'; };
  xhr.onload = () => {
    done();
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status >= 400 || data.error) {
      // 524 是 Cloudflare 的 100 秒逾時：遠端上傳大檔時很常見，講清楚比丟個數字有用
      const hint = xhr.status === 524
        ? '上傳逾時（Cloudflare 100 秒上限）—— 檔案太大或連線太慢，請改傳小一點的檔案'
        : (data.error || `HTTP ${xhr.status}`);
      alert('上傳失敗：' + hint);
      loadDir(currentPath); // 失敗也刷新，讓使用者看到目錄的真實狀態
    } else loadDir(currentPath);
  };
  xhr.onerror = () => { done(); alert('上傳失敗：網路錯誤'); };
  xhr.send(fd);
}
